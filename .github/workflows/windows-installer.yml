# Builds the one-click Windows installer on a real Windows machine, installs it
# the way a new person would (silently here), opens the program and checks it
# answers — so a Setup.exe that does not work never reaches anybody.
#
# The installer it builds is kept for two weeks under this run's "Artifacts",
# and the first time a version passes, its Setup is put on the program's
# GitHub release page, where people download it. A version already there is
# left alone. Nothing about anyone using the program is ever collected.
name: windows-installer
on:
  push:
    paths:
      - "installer/**"
      - "launch.pyw"
      - "run.py"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "config/product.json"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Setup.exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python installer/build_windows.py --out build
          if ($LASTEXITCODE -ne 0) { throw "the build failed" }
          Get-ChildItem build\*-setup.exe | Format-Table Name, Length

      - name: Install it the way a new person would
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\gw-test','/DATADIR=C:\gw-data' -Wait
          if (-not (Test-Path C:\gw-test\runtime\python\pythonw.exe)) { throw "the program was not installed" }
          if (-not (Test-Path C:\gw-test\runtime\node\node.exe)) { throw "Node was not installed" }
          Get-Content C:\gw-test\install.json
          if (-not (Test-Path C:\gw-data)) { throw "the data folder was not made" }

      - name: Its own Python has everything it needs
        shell: pwsh
        working-directory: C:\gw-test
        run: |
          & .\runtime\python\python.exe -c "import cryptography, sqlcipher3, phonenumbers, requests, anthropic, google.auth; print('libraries ok')"
          if ($LASTEXITCODE -ne 0) { throw "a library is missing" }
          & .\runtime\python\python.exe -c "from pipelines import day_run; r = day_run.check_pipelines(); bad = [p for p in r if not p['ok']]; print(len(r), 'steps load'); assert not bad, bad"
          if ($LASTEXITCODE -ne 0) { throw "a step of the day does not load" }

      - name: Open it and check it answers
        shell: pwsh
        working-directory: C:\gw-test
        run: |
          $env:PORT = "3917"
          $p = Start-Process -FilePath .\runtime\python\python.exe -ArgumentList 'run.py','--no-update' -WorkingDirectory C:\gw-test -PassThru -RedirectStandardOutput C:\gw-out.txt -RedirectStandardError C:\gw-err.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { $r = Invoke-RestMethod http://127.0.0.1:3917/api/ping; if ($r.ok) { $ok = $true; break } } catch {} }
          Get-Content C:\gw-out.txt -Tail 25
          if (-not $ok) { Get-Content C:\gw-err.txt -Tail 40; throw "the office did not answer" }
          $prod = Invoke-RestMethod http://127.0.0.1:3917/api/product
          "version $($prod.version), installed: $($prod.installed)"
          if (-not $prod.installed) { throw "the office does not know it was installed" }
          $code = 0
          try { Invoke-WebRequest http://127.0.0.1:3917/api/state -UseBasicParsing | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
          if ($code -ne 401) { throw "a fresh copy did not ask for an account first (it answered $code)" }
          "a fresh copy asks for an account before anything else"
          $who = @{ name = "Tester"; password = "correct horse battery"; confirm = "correct horse battery" } | ConvertTo-Json
          $su = Invoke-RestMethod -Method Post http://127.0.0.1:3917/api/account/sign-up -ContentType 'application/json' -Body $who -SessionVariable gw
          if (-not $su.ok) { throw "an account could not be made: $($su.error)" }
          $add = Invoke-RestMethod -Method Post http://127.0.0.1:3917/api/account/add-site -ContentType 'application/json' -Body (@{ name = "Test shop"; url = "https://example.com" } | ConvertTo-Json) -WebSession $gw
          if (-not $add.ok) { throw "a website could not be added: $($add.error)" }
          $st = Invoke-RestMethod http://127.0.0.1:3917/api/state -WebSession $gw
          if (-not $st.ok) { throw "the office could not read the new website's records" }
          "an account, a website, and the office reads its encrypted records"
          if (Test-Path C:\gw-test\coordination\agency.db) { throw "records were written in the program's own folder" }
          if (Test-Path C:\gw-test\.env) { throw "settings were written in the program's own folder" }
          Invoke-RestMethod -Method Post http://127.0.0.1:3917/api/quit -ContentType 'application/json' -Body '{}' -WebSession $gw
          Start-Sleep 3
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Remove it again
        shell: pwsh
        run: |
          Start-Process -FilePath C:\gw-test\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if (Test-Path C:\gw-test\runtime) { throw "the program was not removed" }
          if (-not (Test-Path C:\gw-data)) { throw "removing the program took the person's data with it" }
          "removed; the person's data folder is still there"

      - uses: actions/upload-artifact@v4
        with:
          name: glasswork-setup
          path: build/*-setup.exe
          retention-days: 14

      - name: Put the tested Setup on the release page (once per version)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(python -c "import json; print(json.load(open('config/product.json'))['version'])")
          if gh release view "v$ver" >/dev/null 2>&1; then echo "v$ver is already on the release page"; exit 0; fi
          exe=$(ls build/*-setup.exe | head -n 1)
          gh release create "v$ver" "$exe" --target "$GITHUB_SHA" --title "Glasswork $ver" --notes "Windows: download the Setup below and open it. If Windows says it protected your PC, choose More info, then Run anyway. Installing over an earlier version keeps all your work. Everything stays on your computer: the program collects nothing about you."
