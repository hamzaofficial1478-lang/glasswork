<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glasswork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* THE NEW DESIGN — the prototype he approved, built on the agency's real data.
   Light by default; dark follows the computer, or the choice in Settings. */
:root{
  --bg:#F3F5F5; --surface:#FFFFFF; --sunken:#F6F8F8; --hover:#EEF2F2;
  --line:#D9E0E0; --line-soft:#EEF2F2; --line-strong:#BCC7C7;
  --ink:#142022; --ink-2:#33464A; --muted:#4A5A5D; --faint:#5F7074;
  --accent:#1F5F66; --accent-hover:#174C52; --accent-ink:#FFFFFF; --accent-soft:#E1EEEE; --nav-on:#123E43;
  --done-bg:#E3F2EA; --done:#1E6642; --wait-bg:#FBEFD9; --wait:#7D4B00;
  --work-bg:#E4ECFA; --work:#244C99; --stuck-bg:#F9E3E1; --stuck:#97241C;
  --plain-bg:#EEF2F2; --plain:#4A5A5D; --ok-dot:#2E8A5B;
  --note-bg:#FFF9EE; --note-line:#EFD9AE; --meter:#E6EBEB;
  --site:#1F5F66;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1415; --surface:#151D1F; --sunken:#1B2527; --hover:#1B2527;
    --line:#283436; --line-soft:#1F2A2B; --line-strong:#3A4A4D;
    --ink:#E3EAEA; --ink-2:#C2CFD0; --muted:#A7B5B7; --faint:#93A3A5;
    --accent:#7FC4C7; --accent-hover:#96D1D3; --accent-ink:#0B1213; --accent-soft:#1E3335; --nav-on:#C6E8E9;
    --done-bg:#173A2A; --done:#8FDDB0; --wait-bg:#3D2E12; --wait:#F2C46D;
    --work-bg:#1C2C4A; --work:#9DB8F2; --stuck-bg:#43201D; --stuck:#F4A49B;
    --plain-bg:#1F2A2B; --plain:#B4C2C3; --ok-dot:#49B37B;
    --note-bg:#2B2414; --note-line:#5A4A26; --meter:#26322F;
    --site:#3E8F95;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1415; --surface:#151D1F; --sunken:#1B2527; --hover:#1B2527;
  --line:#283436; --line-soft:#1F2A2B; --line-strong:#3A4A4D;
  --ink:#E3EAEA; --ink-2:#C2CFD0; --muted:#A7B5B7; --faint:#93A3A5;
  --accent:#7FC4C7; --accent-hover:#96D1D3; --accent-ink:#0B1213; --accent-soft:#1E3335; --nav-on:#C6E8E9;
  --done-bg:#173A2A; --done:#8FDDB0; --wait-bg:#3D2E12; --wait:#F2C46D;
  --work-bg:#1C2C4A; --work:#9DB8F2; --stuck-bg:#43201D; --stuck:#F4A49B;
  --plain-bg:#1F2A2B; --plain:#B4C2C3; --ok-dot:#49B37B;
  --note-bg:#2B2414; --note-line:#5A4A26; --meter:#26322F;
  --site:#3E8F95;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:10px 24px;background:var(--surface);
  border-top:4px solid var(--site);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.01em}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px 4px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;max-width:100%}
.switch:hover{border-color:var(--line-strong);background:var(--sunken)}
.switch .sq{width:10px;height:10px;border-radius:3px;background:var(--site);flex:none}
.switch .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;display:block}
.switch .sub{font-size:12px;color:var(--faint)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(10,20,22,.14);padding:6px;display:none}
.menu.open{display:block}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;border:0;background:none;
  color:var(--ink);text-decoration:none;cursor:pointer;text-align:left;font-size:14.5px;min-height:44px}
.menu a:hover,.menu button:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--line-soft);margin:6px 4px}
.menu small{display:block;color:var(--faint);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;
  font-size:13.5px;color:var(--ink-2);text-decoration:none;background:var(--surface);white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);flex:none}
.dot.off{background:var(--stuck)}
.meter{display:block;height:6px;border-radius:99px;background:var(--meter);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.hot{background:var(--wait)} .meter i.over{background:var(--stuck)}

/* layout */
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 66px)}
.nav{flex:0 0 232px;display:flex;flex-direction:column;gap:2px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink-2);
  text-decoration:none;font-size:14.5px;font-weight:500;min-height:40px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--nav-on);font-weight:600}
.nav .rule{height:1px;background:var(--line-soft);margin:10px 4px}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--wait-bg);color:var(--wait)}
main{flex:1;min-width:0;padding:28px 32px 96px}
main:focus{outline:none}
.page{max-width:1080px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:900px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.lead{margin:6px 0 0;color:var(--muted);max-width:64ch}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-size:17px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;padding:16px 20px;border-top:1px solid var(--line-soft);align-items:flex-start}
.row:first-child{border-top:0}
.row .grow{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{padding:18px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.tile .big{font-size:28px;font-weight:600;letter-spacing:-.01em}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.two>.card{flex:1 1 420px;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;text-decoration:none;
  cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);background:var(--sunken)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:progress}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.done{background:var(--done-bg);color:var(--done)} .wait{background:var(--wait-bg);color:var(--wait)}
.work{background:var(--work-bg);color:var(--work)} .stuck{background:var(--stuck-bg);color:var(--stuck)}
.plain{background:var(--plain-bg);color:var(--plain)}
.seg{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:14px;color:var(--ink-2);cursor:pointer}
.seg:hover{border-color:var(--line-strong)}
.seg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg .n{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.75}
textarea,input[type=text],input[type=url]{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.say{padding:10px 12px;background:var(--sunken);border-radius:8px;font-size:14px}
.note{padding:12px 14px;border-radius:10px;font-size:14px;background:var(--note-bg);border:1px solid var(--note-line)}
.empty{padding:28px 20px;text-align:left;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:12px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:14.5px}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
ol.feed{list-style:none;margin:0;padding:8px 20px 12px}
ol.feed li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
ol.feed li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;
  font-size:14px;max-width:min(560px,calc(100vw - 32px));z-index:20;display:none}
.toast.show{display:block}

/* phone */
.tabs{display:none}
@media (max-width:760px){
  .top{padding:10px 16px;gap:10px}
  .brand b{display:none}
  .switch .nm{max-width:160px}
  .switch .sub{display:none}
  .chip.spend .txt{display:none}
  .nav{display:none}
  main{padding:20px 16px 110px}
  h1{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:14px 16px}
  .tile .big{font-size:22px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 4px 6px;z-index:10}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;text-decoration:none;
    color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
  .tabs a.on{color:var(--accent)}
  .tabs .b{position:absolute;top:6px;left:calc(50% + 6px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:0 5px;
    border-radius:999px;background:var(--wait-bg);color:var(--wait)}
}
/* website check */
.ck-hero{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center;padding:20px 22px}
.ck-score{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:56px;line-height:1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ck-score small{font-size:18px;color:var(--faint);font-weight:400;letter-spacing:0}
.ck-bars{flex:1 1 380px;display:grid;gap:10px;min-width:0}
.ck-bar{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(80px,1.1fr);gap:12px;align-items:center;font-size:14.5px}
.ck-bar b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.ck-bar .meter{height:8px}
.meter i.good{background:var(--done)} .meter i.mid{background:var(--wait)} .meter i.low{background:var(--stuck)}
details.ck{border-top:1px solid var(--line-soft)}
details.ck:first-of-type{border-top:0}
details.ck summary{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:12px 20px;cursor:pointer;
  list-style:none;font-weight:600}
details.ck summary::-webkit-details-marker{display:none}
details.ck summary:hover{background:var(--sunken)}
details.ck summary>span:first-child::before{content:"";display:inline-block;width:7px;height:7px;margin:0 12px 2px 2px;border-right:2px solid var(--faint);
  border-bottom:2px solid var(--faint);transform:rotate(-45deg)}
details.ck[open] summary>span:first-child::before{transform:rotate(45deg)}
details.ck .row{padding-left:40px}
#ckLive:empty{display:none}
.ev{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:var(--faint);overflow-wrap:anywhere}
.ck-logo{display:flex;align-items:center;justify-content:center;min-width:120px;min-height:56px;padding:6px 10px;border:1px dashed var(--line-strong);
  border-radius:10px;background:#FFFFFF}
.ck-logo img{max-height:48px;max-width:200px;display:block}
@media (max-width:760px){.ck-score{font-size:44px} details.ck .row{padding-left:20px}}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.chip,.switch,.seg{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#today" aria-label="Glasswork, back to Today">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="2" y="2" width="22" height="22" rx="5" stroke="var(--accent)" stroke-width="2"></rect><path d="M8 18 L18 8" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"></path><path d="M13 20 L20 13" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" opacity="0.4"></path></svg>
    <b id="brandName">Glasswork</b>
  </a>
  <div style="position:relative;min-width:0">
    <button class="switch" id="siteBtn" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="sq"></span>
      <span style="display:flex;flex-direction:column;line-height:1.25;min-width:0">
        <span class="nm" id="siteName">Your website</span>
        <span class="sub" id="siteSub">switch</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 5.5 L7 9 L10.5 5.5" stroke="var(--faint)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <div class="menu" id="siteMenu" role="menu"></div>
  </div>
  <div style="flex:1 1 auto"></div>
  <a class="chip" id="engineChip" href="/engine"><span class="dot" id="engineDot"></span><span id="engineTxt">AI engine</span></a>
  <a class="chip spend" id="spendChip" href="/engine" style="gap:10px"><span class="mono" id="spendNow">$0.00</span><span class="txt" style="color:var(--faint)" id="spendCap">today</span><span class="meter" style="width:56px"><i id="spendBar" style="width:0"></i></span></a>
</header>

<div class="wrap">
  <nav class="nav" aria-label="Main" id="nav">
    <a href="#today" data-r="today">Today</a>
    <a href="#waiting" data-r="waiting">Waiting on you <span class="count" id="navCount" hidden>0</span></a>
    <a href="#orders" data-r="orders">Your orders</a>
    <a href="#leads" data-r="leads">Leads</a>
    <a href="#content" data-r="content">Content</a>
    <a href="#website" data-r="website">Website</a>
    <a href="#google" data-r="google">On Google</a>
    <div class="rule"></div>
    <a href="#check" data-r="check">Website Check</a>
    <a href="#settings" data-r="settings">Settings</a>
  </nav>
  <main id="main" tabindex="-1"><div class="page"><p class="muted">Opening your office…</p></div></main>
</div>

<nav class="tabs" aria-label="Main" id="tabs">
  <a href="#today" data-r="today"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M3 10 L11 3 L19 10 V19 H3 Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path></svg>Today</a>
  <a href="#waiting" data-r="waiting"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.7"></circle><path d="M11 6.5 V11 L14 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>Waiting<span class="b" id="tabCount" hidden>0</span></a>
  <a href="#leads" data-r="leads"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"></circle><path d="M3 18 C3.8 14.5 6 13 9 13 C12 13 14.2 14.5 15 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>Leads</a>
  <a href="#website" data-r="website"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><rect x="3" y="4" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.7"></rect><path d="M3 8 H19" stroke="currentColor" stroke-width="1.7"></path></svg>Website</a>
  <a href="#more" data-r="more"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="5" cy="11" r="1.6" fill="currentColor"></circle><circle cx="11" cy="11" r="1.6" fill="currentColor"></circle><circle cx="17" cy="11" r="1.6" fill="currentColor"></circle></svg>More</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Number(n || 0).toFixed(2);
const S = {me: null, brand: null, engine: null, state: null, siteIdx: 0};
const SITE_COLOURS = [['#1F5F66', '#3E8F95'], ['#7A4E8C', '#B58BC4']];

/* ---- theme: the computer's, unless chosen in Settings ---- */
function theme(t) {
  try { if (t) localStorage.setItem('gw-theme', t); else t = localStorage.getItem('gw-theme') || 'system'; } catch (e) { t = t || 'system'; }
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  paintSite();
  return t;
}
function dark() {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintSite() {
  const c = SITE_COLOURS[S.siteIdx % SITE_COLOURS.length];
  document.documentElement.style.setProperty('--site', dark() ? c[1] : c[0]);
}

/* ---- talking to the office ---- */
async function api(url, body, method) {
  try {
    const r = await fetch(url, body === undefined && !method ? {cache: 'no-store'} :
      {method: method || 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    let j = {};
    try { j = await r.json(); } catch (e) { j = {ok: false, error: 'The office answered in a way this screen cannot read.'}; }
    if (r.status === 401 && j.signin) { location.href = '/account'; return {ok: false}; }
    if (r.status === 409 && j.needsSite) { location.href = '/account'; return {ok: false}; }
    return j;
  } catch (e) { return {ok: false, error: 'The office did not answer. Is the agency window still open?'}; }
}
function toast(text) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 4200);
}

/* ---- the top bar ---- */
async function loadShell() {
  const [me, brand, engine] = await Promise.all([api('/api/account/me'), api('/api/brand'), api('/api/engine-state')]);
  S.me = me; S.brand = brand; S.engine = engine;
  if (engine && engine.ok && !engine.chosen && me && me.signedIn && me.open) { location.href = '/engine?first=1'; return; }
  const name = (brand && brand.agencyName) || '';

async function runToday(force) {

function shrinkLogo(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { reject(new Error('Choose a PNG, JPEG or WebP picture.')); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 600 / img.width, 200 / img.height);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);
      let d = c.toDataURL('image/png');
      if (d.length > 700000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); d = c.toDataURL('image/jpeg', 0.88); }
      URL.revokeObjectURL(url); resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That picture could not be read.')); };
    img.src = url;
  });
}

    const blob = await r.blob();
    const name = ((r.headers.get('Content-Disposition') || '').match(/filename="?([^";]+)"?/) || [])[1] || 'website-check.pdf';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Saved ' + name + ' to your downloads.');
  } catch (e) { toast('The office did not answer. Is the agency window still open?'); }
  finally { btn.disabled = false; }
}
function watchCheck(id) {
  clearTimeout(CHK.timer);
  CHK.timer = setTimeout(async () => {
    if (!location.hash.startsWith('#check')) return;
    const c = await api(`/api/check/${Number(id)}`);
    if (!location.hash.startsWith('#check')) return;
    if (c && c.ok && c.status === 'running') { const live = $('#ckLive'); if (live) live.innerHTML = liveCard(c); watchCheck(id); return; }
    if (c && c.ok && c.status === 'done') toast('The check of ' + c.host + ' is ready.');
    goCheck(c && c.ok && c.status === 'done' ? id : 0);
  }, 2500);
}
function wireCheck(main, shown) {
  const start = async (url, depth) => {
    const say = $('#ckSay');
    if (!url) { say.textContent = 'Type the website’s address first — for example www.example.com.'; $('#checkUrl').focus(); return; }
    const b = $('#ckGo'); b.disabled = true; say.textContent = 'Starting…';
    const j = await api('/api/check/start', {url, depth});
    if (!j.ok) { b.disabled = false; say.textContent = sentence(j.error || 'The check could not start.'); return; }
    toast('Checking ' + host(j.url) + '…');
    goCheck(0);
  };
  $('#ckGo').onclick = () => start($('#checkUrl').value.trim(), CHK.depth);
  $('#checkUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('#ckGo').disabled) $('#ckGo').click(); });
  main.querySelectorAll('[data-depth]').forEach((b) => b.onclick = () => {
    CHK.depth = b.dataset.depth;
    main.querySelectorAll('[data-depth]').forEach((x) => { const on = x.dataset.depth === CHK.depth; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
  });
  const again = $('#ckAgain');
  if (again && shown) again.onclick = () => start((shown.report || {}).url || shown.url, shown.depth);
  const pdfBtn = $('#ckPdf');
  if (pdfBtn) pdfBtn.onclick = () => downloadPdf(pdfBtn.dataset.id, pdfBtn);
  main.onclick = async (e) => {
    const stop = e.target.closest('[data-stop]'), del = e.target.closest('[data-del]');
    if (stop) { stop.disabled = true; await api(`/api/check/${Number(stop.dataset.stop)}/stop`, {}); clearTimeout(CHK.timer); goCheck(0); }
    if (del) {
      if (!confirm('Delete this check and its report?')) return;
      const j = await api(`/api/check/${Number(del.dataset.del)}/delete`, {});
      if (!j.ok) { toast(j.error || 'Could not delete it.'); return; }
      goCheck(0);
    }
  };
  $('#ckPickLogo').onclick = () => $('#ckLogo').click();
  $('#ckLogo').onchange = async () => {
    const f = $('#ckLogo').files[0]; if (!f) return;
    try {
      CHK.logo = await shrinkLogo(f);
      $('#ckLogoView').innerHTML = `<img src="${esc(CHK.logo)}" alt="Your logo, not saved yet">`;
      toast('Press Save to keep this logo.');
    } catch (err) { toast(err.message); }
  };
  $('#ckSaveBrand').onclick = async () => {
    const body = {name: $('#ckName').value.trim()};
    if (CHK.logo) body.logo = CHK.logo;
    const j = await api('/api/check/brand', body);
    toast(j.ok ? 'Saved. New reports and PDFs carry it.' : (j.error ? sentence(j.error) : 'Could not save it.'));
    if (j.ok) goCheck(Number(new URLSearchParams(location.hash.split('?')[1] || '').get('id')) || 0);
  };
  const noLogo = $('#ckNoLogo');
  if (noLogo) noLogo.onclick = async () => {
    const j = await api('/api/check/brand', {remove_logo: true});
    toast(j.ok ? 'The logo is removed.' : (j.error || 'Could not remove it.'));
    if (j.ok) goCheck(Number(new URLSearchParams(location.hash.split('?')[1] || '').get('id')) || 0);
  };
}

  const row = (href, title, line) => `<a class="row" href="${href}" style="text-decoration:none;color:var(--ink);align-items:center">
    <span class="grow"><b style="font-weight:600">${esc(title)}</b><span class="muted" style="font-size:14px">${esc(line)}</span></span><span style="font-size:14px;font-weight:500;color:var(--accent)">Open</span></a>`;
  main.innerHTML = `<div class="page narrow">${head('Settings',
    'Everything is kept on this computer. Each website has its own settings; what is yours — the AI, your phone, your password — is shared by both.')}
    <section style="display:flex;flex-direction:column;gap:8px"><h2 class="label" style="margin:0">This website</h2><div class="card">
      ${row('/business', 'Your business', 'What you do, where, what you sell and who buys it')}
      ${row('/setup', 'Website and connection', 'Its address, and how the agency reaches it')}
      ${row('/setup', 'Search Console, maps, email and alerts', 'The rest of the keys, on the Setup screen')}
    </div></section>
    <section style="display:flex;flex-direction:column;gap:8px"><h2 class="label" style="margin:0">You</h2><div class="card">
      ${row('/engine', 'How your agency thinks', e.chosen ? e.name + (e.ready ? ' · ready' : ' · not ready') : 'Not chosen yet')}
      ${row('/engine', 'Daily spending limit', e.cap ? money(e.cap) + ' a day, for the AI and every paid tool, across both websites' : 'Set it on the engine page')}
      ${row('/account', me.signedIn ? 'Websites, password and recovery key' : 'Make your account', me.signedIn ? ((me.sites || []).length + ' of ' + (me.maxSites || 2) + ' websites in use') : 'Two websites, encrypted on this computer')}
    </div></section>
    <section style="display:flex;flex-direction:column;gap:8px"><h2 class="label" style="margin:0">This screen</h2>
      <div class="card" style="padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
        <span>Light or dark</span><div role="group" aria-label="Theme" style="display:flex;gap:8px">${[['system', 'Like this computer'], ['light', 'Light'], ['dark', 'Dark']].map(([k, n]) =>
          `<button type="button" class="seg ${k === t ? 'on' : ''}" aria-pressed="${k === t}" data-theme-pick="${k}">${n}</button>`).join('')}</div></div>
      <div class="card">${row('/classic', 'The classic office', 'The previous screens, with every panel, while the rest move across')}</div>
    </section></div>`;
  main.querySelectorAll('[data-theme-pick]').forEach((b) => b.onclick = () => { theme(b.dataset.themePick); buildSiteMenu(); settings(main); });
}

/* ======================= MORE (phone) ======================= */
function more(main) {
  const item = (href, t, s) => `<a class="row" href="${href}" style="text-decoration:none;color:var(--ink);align-items:center"><span class="grow"><b style="font-weight:600">${t}</b><span class="muted" style="font-size:14px">${s}</span></span></a>`;
  main.innerHTML = `<div class="page narrow">${head('More')}<div class="card">
    ${item('#orders', 'Your orders', 'Tell a desk what you want today')}${item('#content', 'Content', 'Posts and pages')}
    ${item('#google', 'On Google', 'Which pages Google lists')}${item('#check', 'Website Check', 'A report on any website')}
    ${item('#settings', 'Settings', 'Your business, the AI, your account')}</div></div>`;
}

/* ---- routing ---- */
const ROUTES = {today, waiting, orders, leads, content, website, google, check, settings, more};
let polling = null;
async function route() {
  const r = (location.hash || '#today').slice(1).split('?')[0];
  const fn = ROUTES[r] || today;
  document.querySelectorAll('[data-r]').forEach((a) => {
    const on = a.dataset.r === r || (r === 'more' && a.dataset.r === 'more');
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const main = $('#main');
  await fn(main);
  clearInterval(polling);
  if (r === 'today' || r === 'waiting') polling = setInterval(() => { if (!document.hidden && !main.contains(document.activeElement)) fn(main); }, 30000);
}
window.addEventListener('hashchange', () => { route(); $('#main').focus({preventScroll: true}); window.scrollTo(0, 0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintSite);
(async function boot() {
  theme();
  await loadShell();
  state();
  route();
  setInterval(async () => { const e = await api('/api/engine-state'); if (e && e.ok) { S.engine = e; paintEngine(); } }, 60000);
})();
</script>
