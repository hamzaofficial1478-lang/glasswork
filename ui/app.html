<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glasswork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* THE NEW DESIGN — the prototype he approved, built on the agency's real data.
   Light by default; dark follows the computer, or the choice in Settings. */
:root{
  --bg:#F3F5F5; --surface:#FFFFFF; --sunken:#F6F8F8; --hover:#EEF2F2;
  --line:#D9E0E0; --line-soft:#EEF2F2; --line-strong:#BCC7C7;
  --ink:#142022; --ink-2:#33464A; --muted:#4A5A5D; --faint:#5F7074;
  --accent:#1F5F66; --accent-hover:#174C52; --accent-ink:#FFFFFF; --accent-soft:#E1EEEE; --nav-on:#123E43;
  --done-bg:#E3F2EA; --done:#1E6642; --wait-bg:#FBEFD9; --wait:#7D4B00;
  --work-bg:#E4ECFA; --work:#244C99; --stuck-bg:#F9E3E1; --stuck:#97241C;
  --plain-bg:#EEF2F2; --plain:#4A5A5D; --ok-dot:#2E8A5B;
  --note-bg:#FFF9EE; --note-line:#EFD9AE; --meter:#E6EBEB;
  --site:#1F5F66; --idle:#B3BFBF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1415; --surface:#151D1F; --sunken:#1B2527; --hover:#1B2527;
    --line:#283436; --line-soft:#1F2A2B; --line-strong:#3A4A4D;
    --ink:#E3EAEA; --ink-2:#C2CFD0; --muted:#A7B5B7; --faint:#93A3A5;
    --accent:#7FC4C7; --accent-hover:#96D1D3; --accent-ink:#0B1213; --accent-soft:#1E3335; --nav-on:#C6E8E9;
    --done-bg:#173A2A; --done:#8FDDB0; --wait-bg:#3D2E12; --wait:#F2C46D;
    --work-bg:#1C2C4A; --work:#9DB8F2; --stuck-bg:#43201D; --stuck:#F4A49B;
    --plain-bg:#1F2A2B; --plain:#B4C2C3; --ok-dot:#49B37B;
    --note-bg:#2B2414; --note-line:#5A4A26; --meter:#26322F;
    --site:#3E8F95; --idle:#62767A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1415; --surface:#151D1F; --sunken:#1B2527; --hover:#1B2527;
  --line:#283436; --line-soft:#1F2A2B; --line-strong:#3A4A4D;
  --ink:#E3EAEA; --ink-2:#C2CFD0; --muted:#A7B5B7; --faint:#93A3A5;
  --accent:#7FC4C7; --accent-hover:#96D1D3; --accent-ink:#0B1213; --accent-soft:#1E3335; --nav-on:#C6E8E9;
  --done-bg:#173A2A; --done:#8FDDB0; --wait-bg:#3D2E12; --wait:#F2C46D;
  --work-bg:#1C2C4A; --work:#9DB8F2; --stuck-bg:#43201D; --stuck:#F4A49B;
  --plain-bg:#1F2A2B; --plain:#B4C2C3; --ok-dot:#49B37B;
  --note-bg:#2B2414; --note-line:#5A4A26; --meter:#26322F;
  --site:#3E8F95; --idle:#62767A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:10px 24px;background:var(--surface);
  border-top:4px solid var(--site);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-weight:700;font-size:17px;letter-spacing:-.01em}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px 4px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;max-width:100%}
.switch:hover{border-color:var(--line-strong);background:var(--sunken)}
.switch .sq{width:10px;height:10px;border-radius:3px;background:var(--site);flex:none}
.switch .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;display:block}
.switch .sub{font-size:12px;color:var(--faint)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(10,20,22,.14);padding:6px;display:none}
.menu.open{display:block}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;border:0;background:none;
  color:var(--ink);text-decoration:none;cursor:pointer;text-align:left;font-size:14.5px;min-height:44px}
.menu a:hover,.menu button:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--line-soft);margin:6px 4px}
.menu small{display:block;color:var(--faint);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:999px;
  font-size:13.5px;color:var(--ink-2);text-decoration:none;background:var(--surface);white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);flex:none}
.dot.off{background:var(--stuck)}
.meter{display:block;height:6px;border-radius:99px;background:var(--meter);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.hot{background:var(--wait)} .meter i.over{background:var(--stuck)}

/* layout */
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 66px)}
.nav{flex:0 0 232px;display:flex;flex-direction:column;gap:2px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink-2);
  text-decoration:none;font-size:14.5px;font-weight:500;min-height:40px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--nav-on);font-weight:600}
.nav .rule{height:1px;background:var(--line-soft);margin:10px 4px}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--wait-bg);color:var(--wait)}
main{flex:1;min-width:0;padding:28px 32px 96px}
main:focus{outline:none}
.page{max-width:1080px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:900px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.lead{margin:6px 0 0;color:var(--muted);max-width:64ch}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-size:17px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;padding:16px 20px;border-top:1px solid var(--line-soft);align-items:flex-start}
.row:first-child{border-top:0}
.row .grow{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{padding:18px 20px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.tile .big{font-size:28px;font-weight:600;letter-spacing:-.01em}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.two>.card{flex:1 1 420px;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;text-decoration:none;
  cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);background:var(--sunken)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:progress}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.done{background:var(--done-bg);color:var(--done)} .wait{background:var(--wait-bg);color:var(--wait)}
.work{background:var(--work-bg);color:var(--work)} .stuck{background:var(--stuck-bg);color:var(--stuck)}
.plain{background:var(--plain-bg);color:var(--plain)}
.seg{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);font-size:14px;color:var(--ink-2);cursor:pointer}
.seg:hover{border-color:var(--line-strong)}
.seg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg .n{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.75}
.seg.tog{cursor:pointer;user-select:none}.seg.tog input{margin:0;width:16px;height:16px;accent-color:var(--site)}
.act-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.act-rooms{display:flex;flex-wrap:wrap;gap:8px}
.act-shown{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);
  padding:8px 8px 8px 14px;border:1px dashed var(--line-strong);border-radius:10px}
textarea,input[type=text],input[type=url],input[type=email],input:not([type]),.dr-sec select{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.say{padding:10px 12px;background:var(--sunken);border-radius:8px;font-size:14px}
.note{padding:12px 14px;border-radius:10px;font-size:14px;background:var(--note-bg);border:1px solid var(--note-line)}
.empty{padding:28px 20px;text-align:left;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:12px 16px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top;font-size:14.5px}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
ol.feed{list-style:none;margin:0;padding:8px 20px 12px}
ol.feed li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
ol.feed li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;
  font-size:14px;max-width:min(560px,calc(100vw - 32px));z-index:20;display:none}
.toast.show{display:block}
.upd-banner{position:fixed;right:20px;bottom:20px;z-index:40;max-width:420px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.upd-banner[hidden],body.drawer-open .upd-banner{display:none}
@media (max-width:760px){.upd-banner{left:12px;right:12px;bottom:84px;max-width:none}}

/* phone */
.tabs{display:none}
@media (max-width:760px){
  .top{padding:10px 16px;gap:10px}
  .brand b{display:none}
  .switch .nm{max-width:160px}
  .switch .sub{display:none}
  .chip.spend .txt{display:none}
  .nav{display:none}
  main{padding:20px 16px 110px}
  h1{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:14px 16px}
  .tile .big{font-size:22px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 4px 6px;z-index:10}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;text-decoration:none;
    color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
  .tabs a.on{color:var(--accent)}
  .tabs .b.bad{background:var(--stuck-bg);color:var(--stuck)}
  .tabs .b{position:absolute;top:6px;left:calc(50% + 6px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:0 5px;
    border-radius:999px;background:var(--wait-bg);color:var(--wait)}
}
/* the agency floor */
.page.wide{max-width:1320px}
.lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:none;vertical-align:middle}
.lamp.work{background:var(--work)} .lamp.done{background:var(--done)} .lamp.stuck{background:var(--stuck)}
.lamp.wait{background:var(--wait)} .lamp.plain{background:var(--line-strong)}
@keyframes lampPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes beamFlow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion:no-preference){.lamp.pulse,.lamp-c.pulse{animation:lampPulse 1.6s ease-in-out infinite}.beam{animation:beamFlow 1.2s linear infinite}}
.fl-tiles button.tile{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line)}
.fl-tiles .tile:hover{border-color:var(--line-strong)}
.tile.bad{background:var(--stuck-bg);border-color:transparent} .tile.bad .big{color:var(--stuck)}
.plan-card{padding:14px 16px 12px}
.plan{display:block;width:100%;height:auto}
.plan-room{cursor:pointer}
.plan-room>rect{fill:var(--sunken);stroke:var(--line);stroke-width:1.5}
.plan-room:hover>rect{stroke:var(--line-strong)}
.plan-room:focus{outline:none}
.plan-room:focus-visible>rect{stroke:var(--accent);stroke-width:2.5}
.plan-room.bad>rect{stroke:var(--stuck);stroke-width:2}
.plan-room.off{opacity:.5}
.plan-name{font:600 12px 'Instrument Sans',system-ui,sans-serif;letter-spacing:.08em;fill:var(--faint)}
.plan-desk{cursor:pointer}
.plan-desk.dim{opacity:.22}
.plan-desk-name{font:500 12.5px 'Instrument Sans',system-ui,sans-serif;fill:var(--ink-2)}
.lamp-c{fill:var(--line-strong);stroke:var(--sunken);stroke-width:3}
.lamp-c.work{fill:var(--work)} .lamp-c.done{fill:var(--done)} .lamp-c.stuck{fill:var(--stuck)} .lamp-c.wait{fill:var(--wait)}
.beam{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 6;fill:none}
.beam.amber{stroke:var(--wait)}
.beam-halo{stroke:var(--surface);stroke-width:6;fill:none;opacity:.85}
.ah.live{fill:var(--accent)} .ah.amber{fill:var(--wait)}
.beam-g{pointer-events:stroke}
.plan-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:8px 4px 0}
.plan-key>span{display:inline-flex;align-items:center;gap:6px}
.beam-key{display:inline-block;width:22px;border-top:2px dashed var(--accent)}
.rooms{columns:3 340px;column-gap:20px}
.rooms>.room{break-inside:avoid;margin:0 0 20px;display:flex;flex-direction:column}
.room-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line-soft)}
.room-h h2{margin:0;font-size:16.5px;font-weight:600}
.linkish{all:unset;cursor:pointer;color:var(--ink)}
.linkish:hover{color:var(--accent)}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.room-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.room.is-off{opacity:.72}
.desks{list-style:none;margin:0;padding:6px}
.desk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av who st" "av what what";column-gap:12px;row-gap:3px;
  align-items:center;width:100%;padding:10px;border:0;border-radius:10px;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.desk:hover{background:var(--hover)}
.desk .av{grid-area:av;align-self:start}
.desk .who{grid-area:who;display:flex;flex-direction:column;min-width:0;line-height:1.3}
.desk .who b{font-weight:600;font-size:15px}
.desk .who small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .pill{grid-area:st}
.desk .what{grid-area:what;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desk.st-failed,.desk.st-stalled,.desk.st-held,.desk.st-blocked{background:var(--stuck-bg)}
.desk.st-failed .what,.desk.st-stalled .what,.desk.st-held .what,.desk.st-blocked .what{color:var(--stuck)}
.desk.st-idle .who b,.desk.st-off .who b{color:var(--ink-2)}
.desk.dim{opacity:.3}
.av{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);
  color:var(--nav-on);font-weight:700;font-size:13.5px;letter-spacing:.02em;flex:none}
.av .lamp{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border:2px solid var(--surface)}
.av.big{width:46px;height:46px;font-size:16px}
.room-board{padding:4px 20px 12px;display:flex;flex-direction:column;gap:6px}
.bl{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.45}
.room-f{padding:10px 20px 14px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--faint)}
.shelf-row{flex-wrap:nowrap;align-items:center}
.shelf-row .grow{flex:1 1 auto}
.shelf-st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13.5px;text-align:right;flex:none}
.rowbtn{width:100%;border:0;border-top:1px solid var(--line-soft);background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.rowbtn:hover{background:var(--sunken)}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 20px;font-size:14px;color:var(--muted)}
.counts b{font-size:17px;color:var(--ink);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));border-radius:0 0 12px 12px;overflow:hidden}
.strip-room{display:flex;flex-direction:column;gap:7px;padding:14px 16px;background:var(--surface);text-decoration:none;color:var(--ink);
  box-shadow:inset -1px -1px 0 var(--line-soft)}
.strip-room:hover{background:var(--sunken);color:var(--ink)}
.strip-room.bad{background:var(--stuck-bg)}
.strip-room .lamps{display:flex;gap:5px;flex-wrap:wrap}
.count.bad{background:var(--stuck-bg);color:var(--stuck)} .count.soft{background:var(--plain-bg);color:var(--plain)}
ol.feed li.unread>span:first-child{color:var(--accent)!important;font-weight:500}
/* the side panel: one agent, one sector, or one conversation */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.34);z-index:30;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:31;
  display:none;flex-direction:column;box-shadow:-12px 0 32px rgba(10,20,22,.14)}
.drawer.open{display:flex}
body.drawer-open{overflow:hidden}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 16px 14px 20px;border-bottom:1px solid var(--line-soft)}
.dr-h h2{margin:0;font-size:18px;font-weight:600}
.dr-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.dr-sec{padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.dr-sec p,.dr-sec h3{margin:0}
#main.busy{position:relative}

<script>
const $ = (q) => document.querySelector(q);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '$' + Number(n || 0).toFixed(2);
const S = {me: null, brand: null, engine: null, state: null, siteIdx: 0};
const SITE_COLOURS = [['#1F5F66', '#3E8F95'], ['#7A4E8C', '#B58BC4']];

/* ---- theme: the computer's, unless chosen in Settings ---- */
function theme(t) {
  try { if (t) localStorage.setItem('gw-theme', t); else t = localStorage.getItem('gw-theme') || 'system'; } catch (e) { t = t || 'system'; }
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  paintSite();
  return t;
}
function dark() {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintSite() {
  const c = SITE_COLOURS[S.siteIdx % SITE_COLOURS.length];
  document.documentElement.style.setProperty('--site', dark() ? c[1] : c[0]);
}

/* ---- talking to the office ----
   "the program lags while changing sections or buttons — it should be fast."
   Reads are kept here for five minutes and shown at once; one older than a
   couple of seconds is asked for again quietly, and the screen is redrawn
   only if the answer actually changed. Anything that changes something (every
   POST) throws the kept answers away, so what is shown after a click is the
   office's answer, never the one from before it. */
const KEPT = new Map(), ASKING = new Map();
const KEPT_MS = 5 * 60000, RECHECK_MS = 2500;
const KEEPABLE = /^\/api\/(state|activity|run\/status|review|leads|content\/topics|comms|leftovers|index-status|orders|results|site\/changes|check\/list|brand|engine-state|sectors|sector\/[^/?]+|mail\/sent\/\d+)(\?|$)/;
async function ask(url) {
  if (ASKING.has(url)) return ASKING.get(url);
  const p = (async () => {
    const r = await fetch(url, {cache: 'no-store'});
    let j = {};
    try { j = await r.json(); } catch (e) { j = {ok: false, error: 'The office answered in a way this screen cannot read.'}; }
    if (r.status === 401 && j.signin) { location.href = '/account'; return {ok: false}; }
    if (r.status === 409 && j.needsSite) { location.href = '/account'; return {ok: false}; }
    if (r.ok && j && j.ok !== false && KEEPABLE.test(url)) KEPT.set(url, {at: Date.now(), j, s: JSON.stringify(j)});
    return j;
  })().catch(() => ({ok: false, error: 'The office did not answer. Is the agency window still open?'}))
    .finally(() => ASKING.delete(url));
  ASKING.set(url, p);
  return p;
}
function recheck(url) {
  if (ASKING.has(url)) return;
  const before = (KEPT.get(url) || {}).s;
  ask(url).then(() => { const now = KEPT.get(url); if (now && before !== undefined && now.s !== before) changed(); });
}
async function api(url, body, method) {
  if (body === undefined && !method) {
    VIEW.urls.add(url);
    const k = KEPT.get(url);
    if (k && Date.now() - k.at < KEPT_MS) { if (Date.now() - k.at > RECHECK_MS) recheck(url); return k.j; }
    return ask(url);
  }
  // A change: nothing kept is true any more. (The editor's live score is a read.)
  if (!/\/score$/.test(url)) { KEPT.clear(); VIEW.dirty = false; }
  try {
    const r = await fetch(url, {method: method || 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    let j = {};
    try { j = await r.json(); } catch (e) { j = {ok: false, error: 'The office answered in a way this screen cannot read.'}; }
    if (r.status === 401 && j.signin) { location.href = '/account'; return {ok: false}; }
    if (r.status === 409 && j.needsSite) { location.href = '/account'; return {ok: false}; }
    return j;
  } catch (e) { return {ok: false, error: 'The office did not answer. Is the agency window still open?'}; }
}

  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('bounces', async () => { $('#bounces').disabled = true; const j = await reviewAct('campaign_bounces'); toast(j.head || j.error || 'Done.'); leads(main); });

/* ======================= CONTENT =======================
   "there is no delete button to delete the unwanted content and also in being
    written section we cannot select that on which topic today user want to
    write the post ... in the publish posts make two buttons 1 of delete from

const CT = {pick: '', timer: null};
function seoPill(score) {
  if (score == null || score === '') return '';
  const n = Number(score);
  return pill(n >= 80 ? 'done' : n >= 55 ? 'wait' : 'stuck', 'SEO ' + n);
}
async function content(main) {

        ${writing ? pill('work', 'Writing now') : ''}</div>
      ${topics.length ? `<div class="topics" role="radiogroup" aria-label="SEO's suggested topics">${topics.map((x) => `<button type="button" role="radio" aria-checked="${CT.pick === x.key}"

          ${x.phrases && x.phrases.length > 1 ? `<span class="muted" style="font-size:12.5px">Also: ${esc(x.phrases.slice(1, 4).join(', '))}</span>` : ''}</button>`).join('')}</div>` : ''}
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">

      ${waitingWrite.length ? `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><span class="label">Waiting to be written</span>

          <span class="muted"> · ${w.held_for_seo ? 'waiting on SEO' : w.chosen_by_you ? 'your choice' : 'next in line'}</span></span>
          <span style="display:flex;gap:6px"><button class="btn ghost small" type="button" data-write="${Number(w.id)}" ${writing ? 'disabled' : ''}>Write now</button>

          <span class="muted" style="font-size:13.5px">${esc(x.keyword || '')}${x.warnings && x.warnings.length ? ' · ' + x.warnings.length + ' note(s) from the checks' : ''}</span>${moving(x)}</span>
          ${seoPill((x.seo || {}).score)}

            <button class="btn quiet small" type="button" data-del="${Number(x.id)}" data-label="${esc(x.title)}">Delete</button></span></div>`).join('') : ''}
      ${pages.map((x) => `<div class="row" style="align-items:center"><span class="grow"><b style="font-weight:600">${esc(x.title)}</b><span class="muted" style="font-size:13.5px">a page of its own · ${esc(x.file || '')}</span></span>

          <span style="display:flex;gap:6px;flex-wrap:wrap">${x.on_backend ? `<a class="btn ghost small" href="#post?id=${Number(x.id)}">Edit</a>
            <button class="btn quiet small" type="button" data-unpublish="${Number(x.id)}" data-label="${esc(x.title)}" ${x.moving ? 'disabled' : ''}>Delete from website</button>`

        : empty('Nothing on your website yet', 'Posts you put up appear here, each with Edit and Delete from website.')}</section>

function edRemember() { const s = getSelection(); if (s.rangeCount && $('#edBody') && $('#edBody').contains(s.anchorNode)) ED.range = s.getRangeAt(0).cloneRange(); }
function edRestore() { const b = $('#edBody'); b.focus(); if (ED.range) { const s = getSelection(); s.removeAllRanges(); s.addRange(ED.range); } }
function edCommand(cmd) {
  const body = $('#edBody'); body.focus();
  if (['h2', 'h3', 'p', 'blockquote'].includes(cmd)) document.execCommand('formatBlock', false, cmd === 'p' ? 'P' : cmd.toUpperCase());
  else if (cmd === 'link') {
    const sel = getSelection(); if (!sel || sel.isCollapsed) { toast('Select the words to link first.'); return; }
    const range = sel.getRangeAt(0).cloneRange();

    if (!url || url === 'https://') return;
    if (!/^(https?:\/\/|\/|mailto:|tel:)/i.test(url.trim())) { toast('That is not a web address — start it with https:// or /'); return; }
    sel.removeAllRanges(); sel.addRange(range); document.execCommand('createLink', false, url.trim());
  } else if (cmd === 'image') { edRemember(); $('#edFile').click(); return; }
  else if (cmd === 'imageUrl') {
    edRemember();
    const url = prompt('The picture’s web address (https://…):', 'https://'); if (!url || !/^https?:\/\//i.test(url)) return;
    const alt = prompt('Describe the picture in a few words:', '') || '';

  } else document.execCommand(cmd, false, null);

function shrinkPicture(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) { reject(new Error('Choose a PNG, JPEG, WebP or GIF picture.')); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / img.width, 1600 / img.height);
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That picture could not be read.')); };
    img.src = url;
  });
}
const FONT_SIZE = {1: 'x-small', 2: 'small', 3: 'medium', 4: 'large', 5: 'x-large', 6: 'xx-large', 7: 'xx-large'};

function shrinkLogo(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { reject(new Error('Choose a PNG, JPEG or WebP picture.')); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 600 / img.width, 200 / img.height);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);
      let d = c.toDataURL('image/png');
      if (d.length > 700000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); d = c.toDataURL('image/jpeg', 0.88); }
      URL.revokeObjectURL(url); resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That picture could not be read.')); };
    img.src = url;
  });
}
async function downloadPdf(id, btn) {
  btn.disabled = true; toast('Making the PDF — this takes a few seconds…');
  try {
    const r = await fetch(`/api/check/${Number(id)}/pdf`, {cache: 'no-store'});
    if (!r.ok || !(r.headers.get('Content-Type') || '').includes('pdf')) {
      let j = {}; try { j = await r.json(); } catch (e) { j = {}; }
      toast(j.error || 'The PDF could not be made. Open the report and use Print, then Save as PDF.');
      return;
    }
    const blob = await r.blob();
    const name = ((r.headers.get('Content-Disposition') || '').match(/filename="?([^";]+)"?/) || [])[1] || 'website-check.pdf';
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Saved ' + name + ' to your downloads.');
  } catch (e) { toast('The office did not answer. Is the agency window still open?'); }
  finally { btn.disabled = false; }
}
function watchCheck(id) {

function wireCheck(main, shown) {
  const start = async (url, depth) => {
    const say = $('#ckSay');

    const b = $('#ckGo'); b.disabled = true; say.textContent = 'Starting…';

    if (del) {
      if (!confirm('Delete this check and its report?')) return;
      const j = await api(`/api/check/${Number(del.dataset.del)}/delete`, {});
      if (!j.ok) { toast(j.error || 'Could not delete it.'); return; }
      goCheck(0);

  $('#ckPickLogo').onclick = () => $('#ckLogo').click();
  $('#ckLogo').onchange = async () => {

    try {

    const j = await api('/api/check/brand', {remove_logo: true});
    toast(j.ok ? 'The logo is removed.' : (j.error || 'Could not remove it.'));
    if (j.ok) goCheck(Number(new URLSearchParams(location.hash.split('?')[1] || '').get('id')) || 0);
  };
}

function deskState(f) { return !f ? 'idle' : f.s === 'blocked' ? (f.problem || 'blocked') : (f.s || 'idle'); }

function seatRoom(room, st) {
  const live = roomLive(room.key, st);

        <span class="muted" style="font-size:13.5px">${esc((FL.comms || {}).head || 'no requests today')}</span></a>
    </div>
    <div role="group" aria-label="Show desks" class="fl-filter" style="display:flex;flex-wrap:wrap;gap:8px">
      ${[['all', 'Every desk'], ['working', 'Working'], ['problem', 'Failed or stuck'], ['you', 'Needs you'], ['done', 'Done'], ['quiet', 'Quiet']].map(([k, n]) =>
        `<button type="button" class="seg ${FL.filter === k ? 'on' : ''}" aria-pressed="${FL.filter === k}" data-filter="${k}">${n}</button>`).join('')}

}

function roomHtml(r) {
  const L = r.live || {}, rd = readinessOf(r.key), off = L.enabled === false;

}
function deskHtml(d) {
  const k = deskState(d.f), lk = ST_LOOK[k] || ['plain', k];
  const t = d.f && d.f.t && k !== 'idle' ? sentence(d.f.t) : '';
  return `<li><button type="button" class="desk st-${k}" data-agent="${esc(d.id)}" data-grp="${groupOf(k)}">
    <span class="av ${lk[0]}${k === 'working' ? ' busy' : ''}" aria-hidden="true">${personIcon(k, 22)}</span>
    <span class="who"><b>${esc(d.n)}</b><small>${esc(d.role)}</small></span>

}
function boardLine(f) {
  const k = f.s === 'waiting' ? ['wait', 'needs your yes'] : f.n === 'no desk can take this' ? ['stuck', 'no desk can take it'] : ['plain', 'next in line'];
  return `<div class="bl" title="${esc(f.why || '')}"><span class="lamp ${k[0]}"></span><span>On the board: <b style="font-weight:600">${esc(f.t || '')}</b> — ${esc(k[1])}</span></div>`;
}

/* The floor plan: the seven rooms, a lamp for every desk, and a line for every
   request one sector has open with another. No requests, no lines — the quiet
   is information, exactly as on the classic floor. */
const PLAN = {Director: [20, 20, 280, 112], Report: [320, 20, 240, 112], Security: [580, 20, 400, 112],
  Leads: [20, 150, 300, 124], SEO: [340, 150, 340, 124], Content: [700, 150, 280, 124], IT: [20, 292, 960, 100]};
function planEdge(b, tx, ty) {
  const cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2, dx = tx - cx, dy = ty - cy;
  const s = Math.min(dx ? (b[2] / 2 + 2) / Math.abs(dx) : Infinity, dy ? (b[3] / 2 + 2) / Math.abs(dy) : Infinity);
  return [cx + dx * s, cy + dy * s];
}
/* An agent at a desk: a person behind a monitor. The person takes the desk's
   colour — working, done, stopped, waiting on you, idle — and the screen says
   the rest: typing while it works, an exclamation mark when it has stopped. */
function agentFigure(cx, cy, k) {
  const tone = (ST_LOOK[k] || ['plain'])[0];
  const bad = PROBLEM.includes(k);
  const screen = k === 'working' ? '<rect class="ag-line l1" x="-6" y="-2.5" width="9" height="1.6" rx=".8"></rect><rect class="ag-line l2" x="-6" y="0.6" width="12" height="1.6" rx=".8"></rect><rect class="ag-line l3" x="-6" y="3.7" width="7" height="1.6" rx=".8"></rect>'
    : bad ? '<text class="ag-alert" x="0" y="4.2" text-anchor="middle">!</text>'
    : k === 'done' ? '<path class="ag-tick" d="M-4 0.8 L-1.2 3.4 L4.2 -2.4"></path>'
    : k === 'waiting' ? '<text class="ag-alert wait" x="0" y="4.2" text-anchor="middle">?</text>' : '';
  return `<g class="agent ${tone}${k === 'off' ? ' off' : ''}" transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)})">
    <circle class="ag-head" cx="0" cy="-15.5" r="6.4"></circle>
    <path class="ag-body" d="M-12 3 Q-12 -8.5 0 -8.5 Q12 -8.5 12 3 Z"></path>
    <rect class="ag-screen" x="-9.5" y="-5.5" width="19" height="12.5" rx="2.2"></rect>${screen}
    <rect class="ag-desk" x="-18" y="7" width="36" height="4" rx="2"></rect></g>`;
}
function personIcon(k, size) {
  const tone = (ST_LOOK[k] || ['plain'])[0];
  return `<svg class="person ${tone}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.2"></circle><path d="M3.8 21.5c0-4.6 3.7-7.6 8.2-7.6s8.2 3 8.2 7.6z"></path></svg>`;
}
function planSvg(rooms) {
  const beams = (((FL.comms || {}).beams) || []).filter((b) => PLAN[b.from_room] && PLAN[b.to_room] && b.from_room !== b.to_room
    && !['answered', 'closed'].includes(b.state)).slice(0, 8);
  let lines = '';
  beams.forEach((b, i) => {
    const A = PLAN[b.from_room], B = PLAN[b.to_room];
    const a = planEdge(A, B[0] + B[2] / 2, B[1] + B[3] / 2), c = planEdge(B, A[0] + A[2] / 2, A[1] + A[3] / 2);
    const tone = b.tone === 'amber' ? 'amber' : 'live';
    // Bowed, so a line across a room — or two between the same rooms — stays readable.
    const dx = c[0] - a[0], dy = c[1] - a[1], len = Math.hypot(dx, dy) || 1, bow = 26 + (i % 3) * 16;
    const qx = (a[0] + c[0]) / 2 - dy / len * bow, qy = (a[1] + c[1]) / 2 + dx / len * bow;
    const d = `M ${a[0].toFixed(1)} ${a[1].toFixed(1)} Q ${qx.toFixed(1)} ${qy.toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
    lines += `<g class="beam-g"><title>${esc(deskName(b.from))} asked ${esc(deskName(b.to))}: ${esc(b.subject || '')}</title>
      <path class="beam-halo" d="${d}"></path><path class="beam ${tone}" d="${d}" marker-end="url(#ah-${tone})"></path></g>`;
  });
  const defs = `<defs>${['live', 'amber'].map((t) => `<marker id="ah-${t}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="ah ${t}" d="M0 0 L10 5 L0 10 Z"></path></marker>`).join('')}</defs>`;
  const roomsSvg = rooms.map((r) => {
    const [x, y, w, h] = PLAN[r.key]; const L = r.live || {};
    const off = L.enabled === false;
    const bad = r.desks.some((d) => PROBLEM.includes(deskState(d.f)));
    const step = w / r.desks.length;
    const lamps = r.desks.map((d, i) => {
      const k = deskState(d.f), lk = ST_LOOK[k] || ['plain', k];
      const cx = x + step * (i + 0.5), cy = y + h * 0.56;
      return `<g class="plan-desk" data-agent="${esc(d.id)}">${agentFigure(cx, cy, k)}
        <text class="plan-desk-name" x="${cx.toFixed(1)}" y="${(cy + 29).toFixed(1)}" text-anchor="middle">${esc(d.n)}</text><title>${esc(d.n)} — ${esc(lk[1])}</title></g>`;
    }).join('');
    return `<g class="plan-room${bad ? ' bad' : ''}${off ? ' off' : ''}" data-sector="${esc(r.key)}" tabindex="0" role="button" aria-label="${esc(L.name || r.name)}: open the sector">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"></rect>
      <text class="plan-name" x="${x + 16}" y="${y + 26}">${esc((L.name || r.name).toUpperCase())}</text>${lamps}</g>`;
  }).join('');
  return `<svg class="plan" viewBox="0 0 1000 410" role="group" aria-label="Floor plan of the agency">${defs}${roomsSvg}${lines}</svg>
    <div class="plan-key">${[['work', 'working'], ['done', 'done'], ['stuck', 'failed or stuck'], ['wait', 'needs your yes'], ['plain', 'idle']].map(([c, n]) =>
      `<span><span class="lamp ${c}"></span>${n}</span>`).join('')}<span><span class="beam-key"></span>a request between sectors</span></div>`;
}

/* "add the shelf button ... when the program will run and if any thing will be

    aria-label="The shelf: ${busy ? busy + ' tool(s) in use' : 'no tool in use'}" title="The tools every desk shares">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.4"></rect><path d="M1.5 6h13M1.5 10.5h13" stroke="currentColor" stroke-width="1.4"></path></svg>

function shelfBody() {

}
function openShelf() {
  const sh = (FL.live && FL.live.shelf) || [];
  const busy = sh.filter((s) => s.holder).length, stocked = sh.filter((s) => s.items).length;
  openPanel(`${panelHead('The shelf', `${busy ? busy + ' in use · ' : ''}${stocked} of ${sh.length} stocked`)}
    <div class="dr-body">${shelfBody()}</div>`, 'The shelf', 'shelf', 'shelf');

function shelfHtml(sh) {
  const stocked = sh.filter((s) => s.items).length, busy = sh.filter((s) => s.holder).length;
  const rows = sh.map((s) => {
    const names = (s.names || []).filter(Boolean);

    const st = s.holder ? `In use by ${esc(deskName(s.holder_sector || ''))}${s.holder ? ' · ' + esc(s.holder) : ''}`
      : s.queue ? `${Number(s.queue)} waiting their turn` : s.items ? 'Ready' : 'No tool on it yet';
    return `<div class="row shelf-row"><span class="lamp ${tone}"></span>
      <span class="grow"><b style="font-weight:600">${esc(SHELF_NAMES[s.shelf] || sentence(String(s.shelf || '').replace(/_/g, ' ')))}</b>
        <span class="muted" style="font-size:13.5px">${names.length ? esc(names[0]) + (names.length > 1 ? ' · backup: ' + esc(names.slice(1).join(', ')) : '') : 'No tool yet — add one on the Setup screen'}</span></span>
      ${s.items || s.holder || s.queue ? `<span class="shelf-st"><span>${st}</span>${s.spend ? `<span class="mono muted">${money(s.spend)} today</span>` : ''}</span>` : ''}</div>`;
  }).join('');
  return `<div class="card-h"><h2>The shelf</h2><span class="muted" style="font-size:13.5px">${busy ? busy + ' in use · ' : ''}${stocked} of ${sh.length} stocked</span></div>
    <p class="muted" style="margin:0;padding:12px 20px 0;font-size:14px">The tools every desk shares. One desk holds a tool at a time; the others wait their turn, so nobody overrides anybody.</p>
    ${rows || empty('The shelf is empty', 'Tools appear here once they are added on the Setup screen.')}
    <div class="row" style="justify-content:flex-end"><a class="btn ghost small" href="/setup">Manage the tools</a></div>`;

function trafficHtml(threads) {
  const look = (t) => t.state === 'closed' ? ['plain', 'Closed'] : t.state === 'answered' ? ['done', 'Answered'] : t.waiting ? ['wait', 'Waiting for an answer'] : ['work', 'Being worked on'];
  const rows = threads.slice(0, 10).map((t) => {
    const lk = look(t);
    return `<button type="button" class="row rowbtn" data-thread="${esc(t.id)}"><span class="grow">
      <span class="mono" style="font-size:12.5px;color:var(--faint)">${esc(deskName(t.from))} → ${esc(deskName(t.to))} · ${esc(t.ago || '')}</span>

  }).join('');

    <p class="muted" style="margin:0;padding:12px 20px 0;font-size:14px">When one sector needs another it asks here and waits for an answer. Nobody reaches into another sector’s work.</p>
    ${rows || empty('No requests today', 'When SEO asks Content for a page, or Leads asks Security to clear a lead, it shows here.')}`;
}

function applyFilter(main) {
  main.querySelectorAll('.desk').forEach((b) => b.classList.toggle('dim', FL.filter !== 'all' && b.dataset.grp !== FL.filter));
  main.querySelectorAll('.plan-desk').forEach((g) => {
    const d = deskById(g.dataset.agent); const grp = d ? groupOf(deskState(d.f)) : 'quiet';
    g.classList.toggle('dim', FL.filter !== 'all' && grp !== FL.filter);
  });
  main.querySelectorAll('.fl-filter [data-filter]').forEach((b) => { const on = b.dataset.filter === FL.filter; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function wireFloor(main) {
  const rb = $('#runNow'); if (rb) rb.onclick = runToday; wireRunSay();
  const sb = $('#stopRun'); if (sb) sb.onclick = async () => { sb.disabled = true; const j = await api('/api/run/stop', {}); toast(j.why || j.head || (j.ok ? 'Stopping.' : j.error || 'Could not stop it.')); route(); };
  const tu = $('#tidyUp'); if (tu) tu.onclick = async () => {
    tu.disabled = true; const j = await api('/api/leftovers/tidy', {});
    toast(sentence((j && (j.head || j.why || j.error)) || 'Cleared up.')); route();
  };
  const rs = $('#resumeRun'); if (rs) rs.onclick = async () => {
    rs.disabled = true; $('#runSay').textContent = 'Checking every desk can work, then picking up what was left…';
    const j = await api('/api/run/resume', {});
    $('#runSay').textContent = j.why || j.error || (j.ok ? 'Picked up.' : 'It did not start.'); rs.disabled = false;
    if (j.ok) setTimeout(route, 1500);
  };
  main.onclick = (e) => {
    const f = e.target.closest('[data-filter]');
    if (f) {
      FL.filter = FL.filter === f.dataset.filter && f.classList.contains('tile') ? 'all' : f.dataset.filter; applyFilter(main);
      if (f.classList.contains('tile') && FL.filter !== 'all') { const first = main.querySelector(`.desk[data-grp="${FL.filter}"]`); if (first) first.scrollIntoView({block: 'center', behavior: 'smooth'}); }
      return;
    }
    const a = e.target.closest('[data-agent]'); if (a) { openAgent(a.dataset.agent); return; }
    const s = e.target.closest('[data-sector]'); if (s) { openSector(s.dataset.sector); return; }
    const t = e.target.closest('[data-thread]'); if (t) { openThread(t.dataset.thread); return; }
    if (e.target.closest('#shelfBtn')) openShelf();
  };
  main.querySelectorAll('.plan-room').forEach((g) => g.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSector(g.dataset.sector); }
  }));
}

/* ---- the side panel: one agent, one sector, or one conversation between two ---- */
function openPanel(html, label, kind, key) {
  const d = $('#drawer');
  if (!d.classList.contains('open')) FL.back = document.activeElement;
  d.innerHTML = html; d.setAttribute('aria-label', label);
  d.classList.add('open'); $('#scrim').classList.add('open'); document.body.classList.add('drawer-open');
  FL.open = {kind, key};
  const c = d.querySelector('[data-close]'); if (c) c.onclick = closePanel;
  setTimeout(() => { const f = d.querySelector('[data-focus]') || c; if (f) f.focus({preventScroll: true}); }, 40);
}
function closePanel() {
  $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); document.body.classList.remove('drawer-open');
  FL.open = null;
  if (FL.back && document.contains(FL.back)) FL.back.focus({preventScroll: true});
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && FL.open) closePanel(); });
function panelHead(title, sub, extra) {
  return `<div class="dr-h"><div style="min-width:0;display:flex;gap:12px;align-items:center">${extra || ''}<div style="min-width:0"><h2>${esc(title)}</h2>
    ${sub ? `<div class="muted" style="font-size:13.5px">${esc(sub)}</div>` : ''}</div></div>
    <button class="btn quiet small" type="button" data-close aria-label="Close">Close</button></div>`;
}

function rightNow(d) {
  const f = d.f || {}, k = deskState(f), t = esc(f.t || '');
  if (k === 'failed') return `<p><b class="bad-t">My last run failed.</b> ${t}</p>${f.why ? `<p class="muted">${esc(f.why)}</p>` : ''}<p class="muted">Ask me below and I’ll tell you what I know about it.</p>`;
  if (k === 'stalled') return `<p><b class="bad-t">I stopped answering.</b> ${t}</p>${f.why ? `<p class="muted">${esc(f.why)}</p>` : ''}`;
  if (k === 'held' || k === 'blocked') return `<p><b class="bad-t">I’m stuck.</b> ${t}</p>${f.why ? `<p class="muted">${esc(f.why)}</p>` : ''}
    ${f.task_id ? `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><button class="btn small" type="button" id="relBtn" data-task="${esc(f.task_id)}">Put the job back on the board</button><span class="muted" id="relSay" style="font-size:13.5px"></span></div>` : ''}`;
  if (k === 'working') return `<p><b>Working now:</b> ${t}</p>`;
  if (k === 'done') return `<p><b>Last thing I did:</b> ${t}</p>`;
  if (k === 'waiting') return `<p><b class="wait-t">I need your yes or no.</b> ${t}</p><p class="muted">Until you decide I can’t start it.</p><a class="btn small" href="#waiting">Go to Waiting on you</a>`;
  if (k === 'queued') return `<p><b>Next in line:</b> ${t}</p><p class="muted">Nothing is blocking it; each sector takes one job at a time.</p>`;
  if (k === 'off') return `<p><b>My sector is switched off.</b> Turn it back on from the sector’s panel and I’ll pick up work again.</p>`;

}
function runRow(x) {
  const tone = x.status === 'ok' ? 'done' : x.status === 'running' ? 'work' : ['error', 'stalled', 'killed'].includes(x.status) ? 'stuck' : 'plain';

function chatHtml(id) {

}
async function openAgent(id) {

  openPanel(`${panelHead(d.n, room + ' · ' + d.role, av)}
    <div class="dr-body" id="drBody">
      <section class="dr-sec"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill(lk[0], lk[1])}

      <section class="dr-sec"><h3 class="label">Talk to ${esc(d.n)}</h3>
        <p class="muted" style="margin:0;font-size:13.5px">Ask what it did, why something failed, or what it would do next. It answers from its own records.</p>

    </div>
    <form class="dr-foot" id="chatForm"><label class="sr" for="chatIn">Message to ${esc(d.n)}</label>
      <input id="chatIn" type="text" autocomplete="off" placeholder="Ask ${esc(d.n)} something…" data-focus>
      <button class="btn" type="submit">Send</button></form>`, d.n, 'agent', id);

async function sendChat(id, name) {
  const inp = $('#chatIn'); const v = inp.value.trim();
  if (!v || FL.asking) return;
  FL.asking = true; inp.value = '';
  const log = FL.chats[id] = FL.chats[id] || [];
  log.push({me: true, html: esc(v)});
  log.push({html: '<span class="muted">Thinking…</span>', wait: true});
  const paint = () => { const el = $('#chatLog'); if (el && FL.open && FL.open.key === id) { el.innerHTML = chatHtml(id); el.scrollTop = el.scrollHeight; } };
  paint();
  const j = await api('/api/chat', {agent: id, message: v});
  log.splice(log.findIndex((m) => m.wait), 1);
  if (!j || !j.ok) log.push({html: `<span class="bad-t">${esc(name)} could not answer: ${esc((j && j.error) || 'no reply')}</span>`});
  else {
    let html = esc(j.reply || '').replace(/\n/g, '<br>');
    if (j.brain_error) html += `<span class="foot bad-t">The AI failed (${esc(j.brain_error)}), so this is read straight from its records.</span>`;
    else if (j.unrouted) html += `<span class="foot">Read straight from its records — the AI is not available: ${esc(j.unrouted)}</span>`;
    else if (j.brain) html += `<span class="foot">Answered with ${esc(j.brain.label || j.brain.model || j.brain)}</span>`;
    log.push({html});
  }
  FL.asking = false; paint();
  const again = $('#chatIn'); if (again && FL.open && FL.open.key === id) again.focus();
}

/* ======================= ACTIVITY ======================= */
const VERB = {got: ['wait', 'Received'], grabbed: ['work', 'Took on'], pushed: ['plain', 'Asked'], delivered: ['done', 'Finished'], errored: ['stuck', 'Failed']};
/* "the activity section get stuck" — it was not stuck, it was filtered. The
   Problems switch sat in the same row as the sector buttons, stayed on between
   visits, and hid every line on a day nothing had failed; each click then went
   back to the office for the same list. Now: the list is fetched once and
   refreshed every 15 seconds, the buttons filter what is already here (no
   wait), Problems is a separate switch that is off each time the screen is
   opened, and a filter that hides lines always says so, with Show everything. */
const ACT = {room: 'all', problems: false, data: null, err: ''};
const isProblem = (e) => e.verb === 'errored' || e.level === 'error';
async function activity(main, local) {
  if (!local || !ACT.data) {
    const got = await api('/api/activity');
    if (got && got.ok !== false) { ACT.data = got; ACT.err = ''; }
    else ACT.err = (got && got.error) || 'The activity could not be read just now.';
  }
  const a = ACT.data || {};
  const ev = a.events || [];
  const rooms = [...new Set(ev.map((e) => e.room).filter(Boolean))];
  if (ACT.room !== 'all' && !rooms.includes(ACT.room)) ACT.room = 'all';
  const inRoom = ev.filter((e) => ACT.room === 'all' || e.room === ACT.room);
  const shown = ACT.problems ? inRoom.filter(isProblem) : inRoom;
  const probs = ev.filter(isProblem).length;
  const filtered = ACT.room !== 'all' || ACT.problems;
  const scroll = window.scrollY;
  main.innerHTML = `<div class="page narrow">${head('Activity',
    'Every line is something a desk actually did — written by the work itself, never summarised by this screen.',
    `<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn ghost small" type="button" id="actRead">Mark all read</button>
      <button class="btn quiet small" type="button" id="actClear">Hide what’s read</button>${a.hidden ? `<button class="btn quiet small" type="button" id="actAll">Show all ${Number(a.hidden)} hidden</button>` : ''}</div>`)}
    ${ACT.err ? `<div class="note">${esc(ACT.err)}${ACT.data ? ' Showing what was read last.' : ''}</div>` : ''}
    <div class="act-bar">
      <div role="group" aria-label="Which sector" class="act-rooms">
        ${['all', ...rooms].map((r) => `<button type="button" class="seg ${ACT.room === r ? 'on' : ''}" aria-pressed="${ACT.room === r}" data-room="${esc(r)}">${r === 'all' ? 'Every sector' : esc(deskName(r))}</button>`).join('')}</div>
      <label class="seg tog ${ACT.problems ? 'on' : ''}"><input type="checkbox" id="actProb" ${ACT.problems ? 'checked' : ''}> Problems only <span class="n">${probs}</span></label></div>
    ${filtered ? `<div class="act-shown"><span>Showing ${shown.length} of ${ev.length} line${ev.length === 1 ? '' : 's'}${ACT.problems ? ' · problems only' : ''}${ACT.room !== 'all' ? ' · ' + esc(deskName(ACT.room)) : ''}</span>
      <button class="btn quiet small" type="button" id="actReset">Show everything</button></div>` : ''}
    <section class="card"><div class="card-h"><h2>${esc(a.head || 'Today')}</h2><span class="muted" style="font-size:13.5px">${Number(a.unread || 0)} unread</span></div>
      ${shown.length ? `<ol class="feed">${shown.map((e) => { const v = VERB[e.verb] || ['plain', sentence(e.verb || '')];
        return `<li${e.at > (a.seen_to || 0) ? ' class="unread"' : ''}><span class="mono" style="font-size:13px;color:var(--faint);padding-top:2px">${esc(e.hhmm || '')}</span>
        <span style="display:flex;flex-direction:column;gap:6px;min-width:0"><span><b style="font-weight:600">${esc(deskName(e.who))}</b> ${esc(e.what || '')}</span>
          <span style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${pill(v[0], v[1])}${e.detail ? `<span class="muted" style="font-size:13.5px">${esc(e.detail)}</span>` : ''}<span class="muted" style="font-size:13px">${esc(e.ago || '')}</span></span></span></li>`; }).join('')}</ol>`
        : ev.length && filtered ? empty(ACT.problems ? 'Nothing has failed' : 'Nothing from this sector',
            `${ACT.problems ? 'No desk has failed today. ' : ''}${ev.length} line${ev.length === 1 ? ' is' : 's are'} hidden by the filter. <button class="btn quiet small" type="button" data-reset>Show everything</button>`)
        : empty('Nothing here yet', 'Give a desk an order and press Run today — each desk’s work appears here as it happens.')}</section></div>`;
  if (local) window.scrollTo(0, scroll);
  const redraw = () => activity(main, true);
  main.querySelectorAll('[data-room]').forEach((b) => b.onclick = () => { ACT.room = b.dataset.room; redraw(); });
  $('#actProb').onchange = (e) => { ACT.problems = e.target.checked; redraw(); };
  main.querySelectorAll('#actReset,[data-reset]').forEach((b) => b.onclick = () => { ACT.room = 'all'; ACT.problems = false; redraw(); });
  const seen = (extra) => api('/api/activity/seen', Object.assign({seen_to: a.newest_at || a.at || Math.floor(Date.now() / 1000)}, extra || {}));
  $('#actRead').onclick = async () => { await seen(); toast('Marked as read.'); state(); activity(main); };
  $('#actClear').onclick = async () => { await seen({clear: true}); toast('Hidden. Nothing is deleted — Show all brings it back.'); state(); activity(main); };
  const all = $('#actAll'); if (all) all.onclick = async () => { await api('/api/activity/seen', {showAll: true}); activity(main); };
}

async function checkUpdate() {

  b.disabled = false;
  $('#updSay').innerHTML = u.ok
    ? (u.available ? `<b style="font-weight:600">Version ${esc(u.latest)} is out.</b> ${u.notes ? `<span class="muted">${esc(u.notes)}</span>` : ''}${u.can_install ? '' : `<br><span class="muted">${esc(u.why || '')}</span>`}` : esc(u.why || 'You have the latest version.'))
    : esc(u.error || 'Could not look for updates.');
  if (u.can_install) {
    $('#updBtns').innerHTML = `<button class="btn small" type="button" id="updGo">Install version ${esc(u.latest)}</button>`;
    $('#updGo').onclick = async () => {
      if (!confirm(`Install version ${u.latest}? Your data and settings are not touched, and you can go back afterwards.`)) return;
      $('#updGo').disabled = true; $('#updSay').textContent = 'Downloading, checking the signature and installing — this takes a minute or two…';
      const j = await api('/api/update/apply', {});
      $('#updSay').textContent = j.why || j.error || (j.ok ? 'Installed.' : 'It was not installed.');
      $('#updBtns').innerHTML = j.ok && j.installed ? '<button class="btn quiet small" type="button" id="updBack">Go back to the previous version</button>' : '';
      const back = $('#updBack'); if (back) back.onclick = undoUpdate;
    };
  } else if (!u.git && u.ok) {
    $('#updBtns').innerHTML = '<button class="btn quiet small" type="button" id="updBack">Go back to the previous version</button>';
    $('#updBack').onclick = undoUpdate;
  }
}

    </div>`;
  const say = (t) => { const x = $('#pubSay'); if (x) x.textContent = t; };

    go.disabled = true;
    const j = await api('/api/publisher/publish', {notes: $('#pubNotes').value.trim(), installer: exe});

      $('#pubJob').textContent = r.ok ? r.why : (r.error || 'It stopped.');

    if (j.ok && j.installed) setTimeout(() => location.reload(), 6000); else $('#updNow').disabled = false;
  };
}

async function undoUpdate() {
  if (!confirm('Go back to the version before the last update?')) return;
  const j = await api('/api/update/rollback', {});
  toast(j.why || j.error || (j.ok ? 'Done.' : 'Nothing to go back to.'));
}

/* ======================= MORE (phone) ======================= */
function more(main) {
  const item = (href, t, s) => `<a class="row" href="${href}" style="text-decoration:none;color:var(--ink);align-items:center"><span class="grow"><b style="font-weight:600">${t}</b><span class="muted" style="font-size:14px">${s}</span></span></a>`;
  main.innerHTML = `<div class="page narrow">${head('More')}<div class="card">
    ${item('#orders', 'Your orders', 'Tell a desk what you want today')}${item('#content', 'Content', 'Posts and pages')}
    ${item('#website', 'Website', 'What changed on your website')}${item('#activity', 'Activity', 'Everything every desk did today')}
    ${item('#results', 'Results', 'What each sector actually produced')}
    ${item('#google', 'On Google', 'Which pages Google lists')}${item('#check', 'Website Check', 'A report on any website')}
    ${item('#settings', 'Settings', 'Your business, the AI, your account')}
    ${item('#help', 'Help and reports', 'Tell us about a problem, and see the answers')}
    ${S.publisher ? item('#reports', 'Reports from users', 'What people using your program sent you') : ''}</div></div>`;
}

/* ---- routing ----
   Each visit to a screen gets its own view of the page. A screen that was left
   before its answer came back can no longer paint over the one now showing —
   which, with clicks faster than the office, is what made the app look stuck
   on the wrong section. */
const ROUTES = {today, agency, waiting, orders, leads, content, post, website, google, activity, results, check, settings, more, help, reports};
const VIEW = {gen: 0, r: '', urls: new Set(), view: null, dirty: false};
const NO_REDRAW = new Set(['post', 'check', 'settings', 'more', 'help', 'reports']);
let polling = null, redrawT = null;
function viewFor(gen) {
  const el = $('#main');
  return new Proxy(el, {
    get: (t, k) => { const v = t[k]; return typeof v === 'function' ? v.bind(t) : v; },
    set: (t, k, v) => { if (gen === VIEW.gen) t[k] = v; return true; },
  });
}
function typing(main) {
  const a = document.activeElement;
  return !!(a && main.contains(a) && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable));
}
// Fresh answers differ from what is on screen: draw it again, unless he is typing on it.
function changed() { clearTimeout(redrawT); redrawT = setTimeout(redraw, 80); }
async function redraw() {
  const main = $('#main'), fn = ROUTES[VIEW.r];
  if (!fn || NO_REDRAW.has(VIEW.r) || document.hidden || typing(main) || VIEW.dirty) return;
  const a = document.activeElement;
  const keep = a && main.contains(a) && a.dataset ? a.dataset.agent || a.dataset.sector || a.dataset.room || a.dataset.tab || '' : '';
  const y = window.scrollY, gen = VIEW.gen;
  await fn(VIEW.view);
  if (gen !== VIEW.gen) return;
  window.scrollTo(0, y);
  if (keep) { const el = main.querySelector(`[data-agent="${CSS.escape(keep)}"], [data-sector="${CSS.escape(keep)}"], [data-room="${CSS.escape(keep)}"], [data-tab="${CSS.escape(keep)}"]`); if (el) el.focus({preventScroll: true}); }
}
// A poll asks again for what this screen read; it is redrawn only if any of it changed.
function poll() { if (!document.hidden) [...VIEW.urls].forEach(recheck); }
async function route() {
  const r = (location.hash || '#today').slice(1).split('?')[0];
  const fn = ROUTES[r] || today;
  document.querySelectorAll('[data-r]').forEach((a) => {
    const on = a.dataset.r === r || (r === 'post' && a.dataset.r === 'content');
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const main = $('#main');
  const gen = ++VIEW.gen;
  if (r === 'activity' && VIEW.r !== 'activity') { ACT.room = 'all'; ACT.problems = false; }
  VIEW.r = ROUTES[r] ? r : 'today'; VIEW.urls = new Set(); VIEW.view = viewFor(gen); VIEW.dirty = false;
  clearInterval(polling); clearTimeout(redrawT);
  // Nothing kept for this screen yet: say so within a blink, rather than leaving
  // the last screen up looking as though the click did nothing.
  const slow = setTimeout(() => { if (gen === VIEW.gen) main.classList.add('busy'); }, 120);
  try { await fn(VIEW.view); } finally { clearTimeout(slow); if (gen === VIEW.gen) main.classList.remove('busy'); }
  if (gen !== VIEW.gen) return;
  const every = {today: 30000, waiting: 30000, activity: 15000, agency: 10000, leads: 20000, content: 20000, results: 30000, website: 30000}[VIEW.r];
  if (every) polling = setInterval(poll, every);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
// Words typed on a screen and not saved yet are never drawn over by a refresh.
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t && $('#main').contains(t) && t.matches('textarea, [contenteditable], input:not([type]), input[type=text], input[type=email], input[type=url], input[type=search], input[type=number]')) VIEW.dirty = true;
}, true);
$('#scrim').addEventListener('click', closePanel);
window.addEventListener('hashchange', () => { if (FL.open) closePanel(); route(); $('#main').focus({preventScroll: true}); window.scrollTo(0, 0); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintSite);
(async function boot() {
  theme();
  await loadShell();
  state();
  route();
  publisherNav();
  updateBanner();
  setInterval(updateBanner, 6 * 3600 * 1000);
  setInterval(async () => { const e = await ask('/api/engine-state'); if (e && e.ok) { S.engine = e; paintEngine(); } }, 60000);
})();
</script>
