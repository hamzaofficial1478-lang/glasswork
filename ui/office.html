<style>
:root{
  --bg:#0c1216; --panel:#131d23; --panel2:#182530; --raise:#1d2c35;
  --floor:#1b2a30; --floor2:#16232a; --wall:#33484f; --walltop:#3f5860;
  --line:#25343c; --line2:#3a515b; --etch:#84a4b1;
  --text:#e7eff3; --muted:#7d919c; --faint:#54666f;
  --glass:#54cbd9; --glass-dim:rgba(84,203,217,.15);
  --amber:#eaa543; --amber-dim:rgba(234,165,67,.15);
  --danger:#e5565b; --danger-dim:rgba(229,86,91,.14); --ok:#5cc088;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.etch{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em;color:var(--etch);font-size:10px}
button{font-family:inherit}

header{position:fixed;top:0;left:0;right:0;height:58px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(12,18,22,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}.brand b{font-size:14px}.brand span{font-size:9px}
.site-switch{position:relative}
.site-btn{display:flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px}
.site-btn .fav{width:20px;height:20px;border-radius:6px;background:var(--glass-dim);border:1px solid var(--glass);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--glass)}
.site-menu{position:absolute;top:46px;left:0;width:250px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.site-menu.open{display:block}
.site-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.site-item:hover{background:var(--panel2)}
.site-item .fav{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;background:var(--glass-dim);border:1px solid var(--glass);color:var(--glass)}
.site-item small{display:block;color:var(--muted);font-size:10.5px;font-family:'IBM Plex Mono',monospace}
.site-add{margin-top:4px;padding:9px 10px;border-radius:8px;border:1px dashed var(--line2);color:var(--glass);cursor:pointer;font-size:12.5px;text-align:center}
.site-add:hover{background:var(--glass-dim)}
.htab{padding:7px 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.htab.on{background:var(--glass-dim);border-color:var(--glass);color:var(--glass)}.htab:hover{color:var(--text)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ok)}
.live .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(92,192,136,.14);animation:pulse 2.4s infinite}
.clock{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);min-width:52px;text-align:right}

.perf{position:fixed;top:58px;left:0;right:0;height:56px;z-index:40;display:flex;align-items:center;padding:0 22px;background:rgba(19,29,35,.7);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.pstat{display:flex;flex-direction:column;gap:1px;padding:0 22px;border-right:1px solid var(--line)}.pstat:first-child{padding-left:0}
.pstat .v{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600}
.pstat .v.glass{color:var(--glass)}.pstat .v.amber{color:var(--amber)}.pstat .v.ok{color:var(--ok)}
.pstat .l{font-size:9.5px}
.perf a{margin-left:auto;color:var(--glass);text-decoration:none;font-size:12.5px}

.stage{position:absolute;top:114px;left:0;right:0;bottom:0;overflow:auto;background:radial-gradient(900px 500px at 70% 0%,rgba(84,203,217,.05),transparent 60%),var(--floor2)}
.floor{position:relative;width:1120px;height:720px;margin:26px auto;background:repeating-linear-gradient(0deg,transparent 0 43px,rgba(255,255,255,.02) 43px 44px),repeating-linear-gradient(90deg,transparent 0 43px,rgba(255,255,255,.02) 43px 44px),linear-gradient(180deg,var(--floor),var(--floor2));border:1px solid var(--line2);border-radius:16px}

/* cyber-link layer sits above the floor, below the rooms/agents */
#links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.room{position:absolute;z-index:2;border:2px solid var(--wall);border-radius:12px;background:linear-gradient(180deg,rgba(20,32,38,.72),rgba(10,16,20,.78));box-shadow:inset 0 2px 0 var(--walltop),0 8px 20px rgba(0,0,0,.3);display:flex;flex-direction:column}
.room.sec{border-color:rgba(229,86,91,.5)}.room.dir{border-color:var(--glass)}
.plaque{position:absolute;top:-11px;left:14px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--etch);white-space:nowrap;z-index:3}
.room.dir .plaque{border-color:var(--glass);color:var(--glass)}
.room.sec .plaque{border-color:rgba(229,86,91,.5);color:var(--danger)}
/* port lights where wires enter a room */
.port{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--glass);box-shadow:0 0 8px var(--glass);opacity:.5;z-index:4}
.room.sec .port{background:var(--danger);box-shadow:0 0 8px var(--danger)}

.desks{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px 4px;padding:18px 8px 8px;overflow:hidden}
.emp{width:72px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.emp .figure{position:relative;animation:bob 3.4s ease-in-out infinite}
/* THERE IS ONE LAMP, AND IT IS THE BULB ON THE ANTENNA.
   ---------------------------------------------------------------------------
   There used to be two. A separate 9px `.status` dot sat at z-index:4 directly
   on top of the bulb — and when an agent was idle, which is most of the day, it
   was painted a flat dull grey.

   That is the whole reason the owner reported "the heads are not glowing" ten
   times and was right ten times. Every fix I made was to the bulb UNDERNEATH a
   grey disc that covered it. I kept confirming the fix by reading the bulb's
   computed colour, which changed correctly every time and was never the thing
   on screen. Reading the value instead of looking at the picture is what let
   that run for ten rounds.

   Two lamps for one fact could only ever disagree. The dot is gone. */
/* a broken desk is dimmed and outlined, so you see it before you read it */
.emp.blocked .figure{opacity:.55}
.emp.blocked .head{border-color:var(--danger)}
/* An unpowered desk is greyed the way an unplugged machine is: it is not
   broken, there is simply nothing behind it to reach. Distinct from the red
   dimming above, which means something went wrong. */
.emp:not(.pw):not(.blocked) .figure{opacity:.62}
.head{width:26px;height:24px;border-radius:9px 9px 8px 8px;margin:0 auto;position:relative;background:linear-gradient(180deg,#c9d6dc,#9fb2ba);border:1px solid #7d929b}
.emp.dir .head{background:linear-gradient(180deg,#8fe6ef,#54cbd9)}.emp.sec .head{background:linear-gradient(180deg,#f0a9ac,#e5565b)}
.head::before,.head::after{content:"";position:absolute;top:9px;width:4px;height:4px;border-radius:50%;background:#1a2429;animation:blink 4.2s infinite}
.head::before{left:6px}.head::after{right:6px}
.antenna{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:2px;height:6px;background:#7d929b}
/* THE BULB ON THE HEAD — the one thing you should read across the room.

   It answers "can this agent work, and is it working" in that order:

     dark       its sector has no working API. The agent has nothing to reach,
                so it could not act even if you asked it to.
     steady     it HAS its sector's API. Powered, not busy. This is the resting
                state of a healthy agency and most desks sit here most of the day.
     blinking   working right now.
     RED        something is wrong with this agent — its last run raised, or it
                started and never came back. The desk says which.

   The previous rule tied the bulb to activity alone, so a sector with every key
   in place looked identical to one with nothing configured: both dark, because
   neither happened to be mid-run. Capability and activity are different
   questions and the owner asked to see both, so the bulb now carries capability
   and the blink carries activity. Nothing was lost — red is still the loud one. */
/* OFF: a small dark bead. Nothing to reach, so nothing is lit. */
.antenna::after{content:"";position:absolute;top:-4px;left:-2.5px;width:7px;height:7px;border-radius:50%;
  background:#26333a;border:1px solid #313f47;box-shadow:none;transition:all .3s ease}

/* ON: powered by its sector's API.
   This was #8fa4ad with a 6px grey halo, which is a technically-different
   colour and a visually identical dot — the owner said ten times that the
   heads were not glowing and he was right every time. I kept checking the
   computed value instead of looking at the picture. A lamp is only lit if it
   looks lit: real colour, three stacked shadows so the halo carries across the
   room, and a matching wash on the head underneath. */
.emp.pw .antenna::after{background:#eafff4;border-color:var(--ok);
  box-shadow:0 0 0 2px rgba(92,192,136,.35), 0 0 10px 2px var(--ok), 0 0 20px rgba(92,192,136,.6)}
.emp.pw .antenna{background:#5f7d86}
.emp.pw .head{border-color:var(--ok);box-shadow:0 0 12px rgba(92,192,136,.45)}

.emp.pw.waiting .antenna::after{background:#fff6e6;border-color:var(--amber);
  box-shadow:0 0 0 2px rgba(234,165,67,.35), 0 0 10px 2px var(--amber), 0 0 20px rgba(234,165,67,.6)}
.emp.pw.waiting .head{border-color:var(--amber);box-shadow:0 0 12px rgba(234,165,67,.45)}

/* WORKING: the same lamp, blinking. An agent can be mid-run before its sector
   has ever been proven, so this does not require .pw. */
.emp.working .antenna::after,
.emp.pw.working .antenna::after{background:#eaffff;border-color:var(--glass);
  box-shadow:0 0 0 2px rgba(84,203,217,.4), 0 0 12px 3px var(--glass), 0 0 24px rgba(84,203,217,.7);
  animation:pulse 1.1s infinite}
.emp.working .head,.emp.pw.working .head{border-color:var(--glass);
  box-shadow:0 0 14px rgba(84,203,217,.55)}

/* BROKEN: red beats everything, and it is the only thing that throbs urgently. */
.emp.blocked .antenna::after,
.emp.pw.blocked .antenna::after{background:#ffecec;border-color:var(--danger);
  box-shadow:0 0 0 2px rgba(229,86,91,.4), 0 0 12px 3px var(--danger), 0 0 24px rgba(229,86,91,.7);
  animation:pulse 1s infinite}
.emp.blocked .head,.emp.pw.blocked .head{border-color:var(--danger);
  box-shadow:0 0 14px rgba(229,86,91,.5)}
.body{width:34px;height:20px;border-radius:10px 10px 5px 5px;margin:-2px auto 0;background:linear-gradient(180deg,#41565f,#2e3f47);border:1px solid #223038}
.desk{width:54px;height:14px;border-radius:5px;margin:3px auto 0;position:relative;background:linear-gradient(180deg,#3a4c54,#293840);border:1px solid #1e2a30;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.monitor{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:22px;height:14px;border-radius:3px;background:#0e161a;border:1px solid #33484f;overflow:hidden}
.monitor .scan{position:absolute;left:2px;right:2px;top:2px;height:2px;background:var(--faint);border-radius:2px}
.emp.working .monitor{border-color:var(--glass)}.emp.working .monitor .scan{background:var(--glass);animation:type 1.3s steps(4) infinite}
.emp.done .monitor{border-color:var(--ok)}.emp.done .monitor .scan{background:var(--ok);opacity:.6}
.name{margin-top:5px;font-size:9.5px;font-weight:500;text-align:center;line-height:1.05}
.role{font-size:8px;color:var(--muted);text-align:center}

/* ---- THE SHELF: a real cabinet standing against the right wall ---- */
.room.shelf{border-color:#5b7a86}
.room.shelf .plaque{border-color:#5b7a86;color:#a8c6d1}
.shelfwrap{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px 9px 10px;overflow-y:auto}
.slot{position:relative;border:1px solid var(--line2);border-radius:7px;background:linear-gradient(180deg,#16242b,#111c22);
  padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.slot.empty{opacity:.4;border-style:dashed}
.slot.busy{border-color:var(--glass);box-shadow:0 0 0 1px var(--glass-dim),0 0 12px rgba(84,203,217,.25)}
.slot .sname{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--etch)}
.slot .api{font-size:10.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who{font-size:9px;color:var(--glass);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .who.wait{color:var(--amber)}
.slot .none{font-size:9px;color:var(--faint);font-style:italic}
.slot .led{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.slot .fb{font-size:8.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .idlebit{color:var(--ok)!important}
.slot .spend{font-size:8.5px;color:var(--amber);font-family:'IBM Plex Mono',monospace}
.shelfhead{display:flex;align-items:baseline;gap:8px;padding:16px 10px 0}
.shelfhead b{font-size:12px;color:var(--glass)}
.shelfhead span{font-size:9.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-left:auto}
.shelfgrp{display:flex;flex-direction:column;gap:4px}
.grph{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:4px 0 1px;border-bottom:1px solid var(--line);padding-bottom:2px}
.slot.busy .led{background:var(--glass);box-shadow:0 0 7px var(--glass);animation:pulse 1.2s infinite}
.slot.stocked .led{background:var(--ok);box-shadow:0 0 6px var(--ok)}

.drawer{position:fixed;top:0;right:-400px;width:400px;max-width:92vw;height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:90;transition:right .26s ease;display:flex;flex-direction:column}
.drawer.open{right:0}
.dh{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.dh .av{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--glass);display:flex;align-items:center;justify-content:center;font-size:19px}
.dh b{font-size:14px}.dh div small{color:var(--muted);font-size:11.5px}
.dh .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.dbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:86%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.45}
.msg.a{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg.u{align-self:flex-end;background:var(--glass-dim);border:1px solid var(--glass)}
.dfoot{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}
.dfoot input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:10px 12px;font-size:13px}
.dfoot input:focus{outline:none;border-color:var(--glass)}
.dfoot button{padding:0 15px;border-radius:9px;border:1px solid var(--glass);background:var(--glass-dim);color:var(--glass);font-weight:600;cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(6,10,12,.6);backdrop-filter:blur(3px);z-index:80;display:none}.scrim.open{display:block}
.panel{position:fixed;top:0;right:-460px;width:460px;max-width:94vw;height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:85;transition:right .26s ease;overflow-y:auto}.panel.open{right:0}
.panel h2{margin:0;padding:18px 20px;font-size:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.panel h2 .x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.pgroup{padding:16px 20px;border-bottom:1px solid var(--line)}.pgroup .gh{margin-bottom:12px}
.conn{display:flex;align-items:center;gap:12px;padding:10px 0}
.conn .ic{width:32px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.conn .nm{flex:1}.conn .nm b{display:block;font-size:13px;font-weight:500}.conn .nm span{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.field{margin:0 0 12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--text);padding:10px 12px;font-size:13px;font-family:'IBM Plex Mono',monospace}
.field input:focus,.field select:focus{outline:none;border-color:var(--glass)}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;cursor:pointer;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:.2s}
.toggle.on{background:var(--glass-dim);border-color:var(--glass)}.toggle.on::after{left:20px;background:var(--glass)}
.pbtn{width:100%;padding:12px;border-radius:10px;border:1px solid var(--glass);background:var(--glass-dim);color:var(--glass);font-weight:600;font-size:14px;cursor:pointer;margin-top:4px}

/* ---- CAN THIS SECTOR WORK? ------------------------------------------------
   The bulbs say what a sector HAS DONE. This says what it COULD do, which is a
   different question and was missing: a sector with no brain and no key looked
   exactly like one that had a quiet morning — both dark, both silent.

   Four states, not two, because green/red would lie in both directions:
     ready      proven — an API was actually called and answered
     unchecked  configured but never called. A saved key is not a working key,
                so this is deliberately NOT green
     thin       runs, but one thing dying stops it
     blocked    cannot run at all
   ------------------------------------------------------------------------- */
.rdy{position:absolute;top:-11px;right:12px;z-index:4;display:flex;align-items:center;gap:5px;
     padding:3px 8px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;
     letter-spacing:.1em;text-transform:uppercase;cursor:help;white-space:nowrap;
     background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.rdy .b{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.rdy.ready{border-color:var(--ok);color:var(--ok)}
.rdy.ready .b{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.rdy.unchecked{border-color:var(--line2);color:var(--etch)}
.rdy.unchecked .b{background:transparent;border:1px solid var(--etch)}
.rdy.thin{border-color:var(--amber);color:var(--amber)}
.rdy.thin .b{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.rdy.blocked{border-color:var(--danger);color:var(--danger)}
.rdy.blocked .b{background:var(--danger);box-shadow:0 0 8px var(--danger);animation:pulse 1.6s infinite}
/* a sector that cannot run gets a wash across the whole room, not just a chip —
   the chip is easy to miss when you are looking at the desks */
.room.rd-blocked{background:linear-gradient(180deg,rgba(229,86,91,.09),rgba(10,16,20,.8))}
.room.rd-thin{background:linear-gradient(180deg,rgba(234,165,67,.06),rgba(10,16,20,.8))}

/* ---- THE RUN BUTTON ---- */
.runbtn{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;
        border:1px solid var(--ok);background:rgba(92,192,136,.14);color:var(--ok);
        font-size:13px;font-weight:600;cursor:pointer}
.runbtn:hover{background:rgba(92,192,136,.24)}
.runbtn.busy{border-color:var(--glass);background:var(--glass-dim);color:var(--glass)}
.runbtn .b{width:8px;height:8px;border-radius:50%;background:currentColor}
.runbtn.busy .b{animation:pulse 1.1s infinite}
/* A wider panel must also park further off-screen. Widening it alone left
   100px of an invisible panel sitting over the right of the header, swallowing
   clicks on the Run button and on whichever panel was actually open. */
.panel.wide{width:560px;right:-560px}
/* .panel.open is declared earlier and has the same specificity, so without this
   the wide panels would never slide in — they'd open off-screen. */
.panel.wide.open{right:0}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.step .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);color:var(--faint);
         font-family:'IBM Plex Mono',monospace;font-size:9px;display:flex;align-items:center;
         justify-content:center;flex:none}
.step.ok .n{border-color:var(--ok);color:var(--ok)}
/* 'idle' is its own outcome: the sector ran and had nothing to do. A green tick
   beside the words "no task on the board" is the dashboard contradicting itself. */
.step.idle .n{border-color:var(--line2);color:var(--faint)}
.step.idle .t{color:var(--muted)}
.step.failed .n{border-color:var(--danger);color:var(--danger)}
.step.running .n{border-color:var(--glass);color:var(--glass);animation:pulse 1.1s infinite}
.step .t{flex:1}.step .t small{display:block;color:var(--muted);font-size:10.5px;
         font-family:'IBM Plex Mono',monospace;margin-top:2px}
.chk{display:flex;gap:9px;padding:7px 0;font-size:12.5px;align-items:flex-start}
.chk .m{font-family:'IBM Plex Mono',monospace;flex:none;width:14px}
.chk.ok .m{color:var(--ok)}.chk.bad .m{color:var(--danger)}.chk.warn .m{color:var(--amber)}
.chk.dim .m{color:var(--faint)}
.chk small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--glass);transition:width .4s ease}
.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;
                color:var(--text);padding:10px 12px;font-size:12.5px;font-family:inherit;
                resize:vertical;min-height:46px}
.field textarea:focus{outline:none;border-color:var(--glass)}
.warnbox{border:1px solid var(--danger);background:var(--danger-dim);border-radius:10px;padding:12px;
         font-size:12.5px;margin-bottom:12px}
.warnbox b{color:var(--danger)}
.tick{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin:10px 0;cursor:pointer}
.tick .bx{width:16px;height:16px;border-radius:4px;border:1px solid var(--line2);flex:none}
.tick.on .bx{background:var(--danger);border-color:var(--danger)}

/* ---- WHAT EACH AGENT GOT, GRABBED, PUSHED, DELIVERED, BROKE ON ---- */
.act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.act .tm{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);width:38px;flex:none;padding-top:2px}
.act .vb{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
         padding:2px 6px;border-radius:4px;height:16px;flex:none;border:1px solid var(--line2);color:var(--muted)}
.act.got .vb{border-color:var(--amber);color:var(--amber)}
.act.grabbed .vb{border-color:var(--glass);color:var(--glass)}
.act.pushed .vb{border-color:var(--line2);color:var(--etch)}
.act.delivered .vb{border-color:var(--ok);color:var(--ok)}
.act.errored .vb{border-color:var(--danger);color:var(--danger)}
.act .bd{flex:1;min-width:0}
.act .bd b{font-weight:500;display:block;word-break:break-word}
.act .bd small{color:var(--muted);font-size:10.5px;font-family:'IBM Plex Mono',monospace}
.act .bd em{font-style:normal;color:var(--faint);font-size:10px}
.act.live .bd b{color:var(--glass)}
.ticker{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:45;display:none;align-items:center;
        gap:14px;padding:0 22px;background:rgba(19,29,35,.94);backdrop-filter:blur(8px);
        border-top:1px solid var(--line);font-size:12px}
.ticker.on{display:flex}
.ticker .lb{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--glass);flex:none}
.ticker .ln{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker .more{margin-left:auto;color:var(--glass);cursor:pointer;font-size:11.5px;flex:none}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes type{0%{transform:translateX(-6px)}100%{transform:translateX(6px)}}
@keyframes flow{to{stroke-dashoffset:-16}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Glassworks Agency</b><span class="etch">Live office</span></div>
  <div class="site-switch">
    <button class="site-btn" onclick="toggleSites(event)"><span class="fav" id="curFav">GD</span><span id="curSite">Glassworks Dubai</span><span style="color:var(--muted)">▾</span></button>
    <div class="site-menu" id="siteMenu"></div>
  </div>
  <button class="htab on">Office</button>
  <button class="htab" onclick="openActivity()">Activity <span id="actBadge"></span></button>
  <button class="htab" onclick="openPanel('perfPanel')">Performance</button>
  <button class="htab" onclick="openPanel('connPanel')">Connections</button>
  <div class="spacer"></div>
  <button class="runbtn" id="runBtn" onclick="openRun()"><span class="b"></span><span id="runLabel">Run the day</span></button>
  <span class="live"><span class="d"></span>Open</span>
  <span class="clock" id="clock">--:--</span>
</header>

<div class="perf" id="perfStrip"></div>
<div class="stage"><div class="floor" id="floor"><svg id="links"></svg></div></div>

<div class="drawer" id="drawer">
  <div class="dh"><div class="av" id="dAv">🤖</div><div><b id="dName">Agent</b><br><small id="dRole">role</small></div><button class="x" onclick="closeDrawer()">×</button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot"><input id="dInput" placeholder="Ask this agent for work…" onkeydown="if(event.key==='Enter')askAgent()"><button onclick="askAgent()">Ask</button></div>
</div>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<div class="panel" id="connPanel"><h2>Connections <button class="x" onclick="closeAll()">×</button></h2><div id="connBody"></div></div>
<div class="panel" id="perfPanel"><h2>Performance <button class="x" onclick="closeAll()">×</button></h2><div id="perfBody"></div></div>
<div class="panel" id="sitePanel">
  <h2>Add a website <button class="x" onclick="closeAll()">×</button></h2>
  <div class="pgroup">
    <div class="field"><label>Business name</label><input id="nsName" placeholder="e.g. Sharjah Glass Co"></div>
    <div class="field"><label>Website URL</label><input id="nsUrl" placeholder="https://…"></div>
    <div class="field"><label>Platform</label><select id="nsStack"><option>WordPress</option><option>Custom backend</option><option>Shopify</option><option>Other</option></select></div>
    <div class="field"><label>Main areas (comma separated)</label><input id="nsAreas" placeholder="Dubai, Abu Dhabi, Sharjah"></div>
    <button class="pbtn" onclick="addSite()">Create office for this website</button>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px">A fresh office opens with all six sectors staffed, kept completely separate from your other websites.</p>
  </div>
</div>

<!-- WHAT EVERY AGENT GOT, GRABBED, PUSHED, DELIVERED OR BROKE ON.
     Derived from the rows the work itself wrote — a claimed task, a granted
     borrow, a finished run — never from a log an agent had to remember to
     write. See coordination/activity.py for why. -->
<div class="panel wide" id="actPanel">
  <h2><span>Activity <small id="actHead" style="color:var(--muted);font-weight:400;font-size:11.5px"></small></span>
      <button class="x" onclick="closeAll()">×</button></h2>
  <div class="pgroup" id="actBody"></div>
</div>

<!-- THE RUN BUTTON. Three beats: check everything, take the owner's orders,
     then work. Each beat is its own screen so nothing starts by accident. -->
<div class="panel wide" id="runPanel">
  <h2><span>Run the agency</span><button class="x" onclick="closeAll()">×</button></h2>
  <div id="runBody"></div>
</div>

<div class="ticker" id="ticker">
  <span class="lb" id="tickLabel">Live</span>
  <span class="ln" id="tickLine">—</span>
  <span class="more" onclick="openActivity()">see everything →</span>
</div>

<script>
/* The staff list: who sits where. NOT what they are doing — every desk starts
   dark and stays dark until the server says otherwise.

   This used to ship each desk with s:"working" and a plausible-sounding task,
   which is why the floor lit up for a moment on a hard refresh and then went
   dark: the first paint was a mock-up, and the truth arrived a beat later. A
   dashboard that shows work nobody did is worse than one that shows nothing,
   so the placeholder is gone. If a bulb is lit, an agent really ran. */
/* Every desk carries an `id` as well as a label. The chat drawer used to send
   the LABEL — 'Watcher', 'Hunter' — which has no sector in it, so the server
   could not tell which sector's brain should answer and fell back to the
   Director's. Sixteen desks out of seventeen were answering on the MD's model.
   The label is for reading; the id is for addressing, and it never changes. */
function sectors(){return [
  {key:"Director",name:"Director's Office",cls:"dir",agents:[{id:"managing-director",n:"Director",role:"Plans the day",s:"idle",t:"—",av:"🔮"}]},
  {key:"IT",name:"IT & Site Health",cls:"",agents:[{id:"it-watcher",n:"Watcher",role:"Finds issues",s:"idle",t:"—",av:"🛠"},{id:"it-fixer",n:"Fixer",role:"Patches in a branch",s:"idle",t:"—",av:"🧰"},{id:"it-releaser",n:"Releaser",role:"Only agent on production",s:"idle",t:"—",av:"🚀"}]},
  {key:"Content",name:"Content & Social",cls:"",agents:[{id:"content-writer",n:"Writer",role:"Drafts in your voice",s:"idle",t:"—",av:"✍"},{id:"content-illustrator",n:"Illustrator",role:"Real photos + stock",s:"idle",t:"—",av:"🎨"},{id:"content-publisher",n:"Publisher",role:"Publishes after Auditor",s:"idle",t:"—",av:"📤"}]},
  /* Rival has a desk of its own because pipelines/competitors.py runs as
     'seo-rival' every day. Without one it fell through to the first free desk
     and lit the Auditor's lamp instead — work credited to the wrong chair. */
  {key:"SEO",name:"SEO & Rankings",cls:"",agents:[{id:"seo-auditor",n:"Auditor",role:"On-page & schema",s:"idle",t:"—",av:"🔍"},{id:"seo-strategist",n:"Strategist",role:"Keyword gaps",s:"idle",t:"—",av:"🧭"},{id:"seo-rival",n:"Rival",role:"Watches competitors",s:"idle",t:"—",av:"👁"},{id:"seo-backlinks",n:"Backlinks",role:"Links & guest posts",s:"idle",t:"—",av:"🔗"}]},
  {key:"Leads",name:"Leads & Outreach",cls:"",agents:[{id:"leads-hunter",n:"Hunter",role:"Finds UAE leads",s:"idle",t:"—",av:"🎯"},{id:"leads-scanner",n:"Scanner",role:"Blocks duplicates",s:"idle",t:"—",av:"♻"},{id:"leads-outreach",n:"Outreach",role:"Mail + DMs, under cap",s:"idle",t:"—",av:"✉"},{id:"leads-responder",n:"Responder",role:"Handles replies",s:"idle",t:"—",av:"💬"}]},
  {key:"Report",name:"Reports",cls:"",agents:[{id:"reporter",n:"Reporter",role:"Scores the agency",s:"idle",t:"—",av:"📋"}]},
  {key:"Security",name:"Security",cls:"sec",agents:[{id:"security-screener",n:"Screener",role:"Scam & fraud filter",s:"idle",t:"—",av:"🛡"},{id:"security-guard",n:"Guard",role:"Untrusts scraped text",s:"idle",t:"—",av:"⚠"}]}
];}
/* Dashes, not numbers, until the server answers. The desks were fixed for this
   already — they used to ship lit and go dark a beat later — but the header
   still opened on 82 health, 6 leads and $4.12 spent, on a machine that had
   never run anything. A number you have not been given is not a number. */
const BLANK_METRICS=[["—","Agency health","glass"],["—","Leads today",""],
                     ["—","Awaiting you","amber"],["—","Shelf","ok"],
                     ["—","Spend today","mono"]];
const SITES={gd:{name:"Glassworks Dubai",fav:"GD",url:"glassworks.ae",
                 metrics:BLANK_METRICS.map(m=>m.slice()),rooms:sectors()}};
let CURRENT="gd";
const LAYOUT={Director:{x:24,y:22,w:320,h:150},Report:{x:372,y:22,w:230,h:150},Security:{x:630,y:22,w:266,h:150},Leads:{x:24,y:210,w:400,h:210},SEO:{x:454,y:210,w:210,h:210},Content:{x:694,y:210,w:202,h:210},IT:{x:24,y:452,w:872,h:242}};
const $=s=>document.querySelector(s);
const SVGNS="http://www.w3.org/2000/svg";

function renderFloor(){
  const st=SITES[CURRENT], floor=$('#floor');
  [...floor.querySelectorAll('.room,.plant')].forEach(n=>n.remove());
  st.rooms.forEach(rm=>{
    const L=LAYOUT[rm.key]; if(!L)return;
    const room=document.createElement('div');
    const rd=readyOf(rm.key);
    // "Powered" = this sector has at least one API that answers, so its agents
    // can actually reach something. Not the same as busy, and not the same as
    // healthy — a thin or unproven sector still has a working key behind it.
    const powered = !!rd && rd.state !== 'blocked';
    room.className='room '+rm.cls+(rd?' rd-'+rd.state:'');
    room.style.cssText=`left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px`;
    room.innerHTML=`<div class="plaque">${rm.name}</div>`+readyChip(rd,rm.name,L.w)+`<div class="desks">`+
      rm.agents.map((a,i)=>`<div class="emp ${a.s} ${rm.cls} ${powered?'pw':''}" data-k="${rm.key}" data-i="${i}"><div class="figure"><div class="antenna"></div><div class="head"></div><div class="body"></div><div class="desk"><div class="monitor"><div class="scan"></div></div></div></div><div class="name">${a.n}</div><div class="role">${a.role.split(' ')[0]}</div></div>`).join('')
      +`</div>`;
    floor.appendChild(room);
  });
  floor.querySelectorAll('.emp').forEach(el=>{
    el.onclick=()=>{const rm=st.rooms.find(r=>r.key===el.dataset.k);const a=rm.agents[+el.dataset.i];a.room=rm.name;openDrawer(a);};
  });
  renderShelfRoom(floor);
  [['🪴',430,662],['🌿',600,192]].forEach(([e,x,y])=>{const p=document.createElement('div');p.className='plant';p.style.cssText=`position:absolute;z-index:2;font-size:19px;opacity:.75;left:${x}px;top:${y}px`;p.textContent=e;floor.appendChild(p);});
  drawLinks();
}

/* ---- CAN THIS SECTOR WORK? -----------------------------------------------
   Read straight from coordination/readiness.py, which comes down inside the
   same /api/state poll. The wording is the server's, not the browser's: if the
   reason a sector cannot run ever changes, it changes in one place. --------- */
const RDY_WORD={ready:'apis working',unchecked:'not proven',thin:'no fallback',blocked:'cannot run'};
const RDY_STATES=['unchecked','ready','thin','blocked'];
function readyOf(key){
  const rs=(LIVE&&LIVE.readiness&&LIVE.readiness.sectors)||[];
  return rs.find(s=>s.room===key)||null;
}
/* The chip sits on the same border line as the room's plaque, so on a narrow
   room the two collide and the plaque loses its last few letters. When there
   isn't room for both, the word drops and the lamp stays — the colour is the
   part you read from across the screen; the words are in the tooltip. */
function readyChip(rd, roomName, width){
  if(!rd) return '';
  const tip=[rd.says,...(rd.blocking||[]),...(rd.thin||[]),...(rd.notes||[])]
    .filter((v,i,a)=>v&&a.indexOf(v)===i).join('\n');
  const st = oneOf(rd.state, RDY_STATES);
  const word = RDY_WORD[st];
  const fits = width >= String(roomName||'').length*6.4 + word.length*5.6 + 74;
  return `<div class="rdy ${st}" title="${escA((fits?'':word+' — ')+tip)}">`
       + `<span class="b"></span>${fits?word:''}</div>`;
}

/* THE SHELF — a cabinet standing against the right wall of the office. Each slot
   is one capability shelf: the API sitting on it, and the sector currently
   holding it. This is the same data the agents borrow through. */
const SHELF_BOX={x:912,y:22,w:184,h:672};
function renderShelfRoom(floor){
  const sh=(LIVE&&LIVE.shelf)||[];
  const room=document.createElement('div');
  room.className='room shelf';
  room.style.cssText=`left:${SHELF_BOX.x}px;top:${SHELF_BOX.y}px;width:${SHELF_BOX.w}px;height:${SHELF_BOX.h}px`;
  if(!sh.length){
    room.innerHTML=`<div class="plaque">The shelf</div><div class="shelfwrap">`
      +`<div class="slot empty"><div class="none">waiting for the server…</div></div></div>`;
    floor.appendChild(room); return;
  }
  // group by what the shelf is FOR, so the cabinet reads like real shelving
  const ORDER=['reasoning','data','delivery','other','custom'];
  const LABEL={reasoning:'Reasoning',data:'Data',delivery:'Delivery',other:'Other',custom:'Custom'};
  const groups={};
  sh.forEach(s=>{ const k=s.purpose||'custom'; (groups[k]=groups[k]||[]).push(s); });

  const slot=s=>{
    const cls = s.holder ? 'busy' : (s.items ? 'stocked' : 'empty');
    const names=(s.names||[]).filter(Boolean);
    const primary=names[0]||'';
    const fb=names.slice(1);
    let line;
    if(s.holder){
      const who = s.holder_sector ? (s.holder_sector+' · '+s.holder) : s.holder;
      line = `<div class="who">▸ ${who}</div>`;
    } else if(s.queue){
      line = `<div class="who wait">${s.queue} waiting</div>`;
    } else if(s.items){
      line = `<div class="who idlebit">ready</div>`;
    } else {
      line = `<div class="none">no API yet</div>`;
    }
    return `<div class="slot ${cls}"><div class="led"></div>`
      + `<div class="sname">${s.shelf}</div>`
      + (primary?`<div class="api">${primary}</div>`:'')
      + (fb.length?`<div class="fb">↳ fallback: ${fb.join(', ')}</div>`:'')
      + line
      + (s.spend?`<div class="spend">$${s.spend} today</div>`:'')
      + `</div>`;
  };

  const body=ORDER.filter(k=>groups[k]).map(k=>
    `<div class="shelfgrp"><div class="grph">${LABEL[k]}</div>`
    + groups[k].map(slot).join('') + `</div>`).join('');

  const stocked=sh.filter(s=>s.items).length, busy=sh.filter(s=>s.holder).length;
  room.innerHTML=`<div class="plaque">The shelf · ${stocked}/${sh.length}</div>`
    + `<div class="shelfhead"><b>${busy?busy+' in use':'all idle'}</b>`
    + `<span>${stocked} stocked</span></div>`
    + `<div class="shelfwrap">${body}</div>`;
  floor.appendChild(room);
}

/* ---------- CYBER LINKS ---------- */
const LINKS=[["Leads","Security"],["Content","SEO"],["SEO","IT"],["IT","Report"],["Report","Director"],["Content","Security"],["Leads","Director"],["SEO","Content"]];
function edgePoint(box,tx,ty){
  const cx=box.x+box.w/2, cy=box.y+box.h/2, dx=tx-cx, dy=ty-cy;
  const hw=box.w/2+2, hh=box.h/2+2;
  const sx=dx===0?Infinity:hw/Math.abs(dx), sy=dy===0?Infinity:hh/Math.abs(dy), s=Math.min(sx,sy);
  return {x:cx+dx*s, y:cy+dy*s};
}
function drawLinks(){
  const svg=$('#links'); svg.setAttribute('viewBox','0 0 1120 720');
  svg.innerHTML=`<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
  // remove old ports
  document.querySelectorAll('.port').forEach(p=>p.remove());
  LINKS.forEach(([a,b],i)=>{
    const A=LAYOUT[a],B=LAYOUT[b];
    const pa=edgePoint(A,B.x+B.w/2,B.y+B.h/2), pb=edgePoint(B,A.x+A.w/2,A.y+A.h/2);
    const d=`M ${pa.x} ${pa.y} L ${pb.x} ${pb.y}`;
    const path=document.createElementNS(SVGNS,'path');
    path.setAttribute('d',d); path.setAttribute('id','wire'+i);
    path.setAttribute('fill','none'); path.setAttribute('stroke','var(--glass)');
    path.setAttribute('stroke-width','1.4'); path.setAttribute('stroke-opacity','.16');
    path.setAttribute('stroke-dasharray','3 5');
    path.style.animation='flow 1.1s linear infinite';
    svg.appendChild(path);
    // port lights on each end
    [[a,pa],[b,pb]].forEach(([rk,pt])=>{
      const dot=document.createElement('div');dot.className='port'+((rk==='Security')?' ':'');
      dot.style.cssText=`left:${pt.x-3.5}px;top:${pt.y-3.5}px`;$('#floor').appendChild(dot);
    });
  });
}
const COMMS=[
  {a:"Leads",b:"Security",label:"verify lead?",type:"amber"},
  {a:"Security",b:"Leads",label:"✓ cleared",type:"glass"},
  {a:"Content",b:"SEO",label:"keyword worth it?",type:"glass"},
  {a:"SEO",b:"IT",label:"change page",type:"glass"},
  {a:"IT",b:"Report",label:"fix logged",type:"glass"},
  {a:"Content",b:"Security",label:"scraped — check",type:"amber"},
  {a:"Report",b:"Director",label:"scores in",type:"glass"},
  {a:"Leads",b:"Director",label:"hot reply",type:"amber"}
];
function fireComm(){
  const c=COMMS[Math.floor(Math.random()*COMMS.length)];
  const A=LAYOUT[c.a],B=LAYOUT[c.b];
  const pa=edgePoint(A,B.x+B.w/2,B.y+B.h/2), pb=edgePoint(B,A.x+A.w/2,A.y+A.h/2);
  const col=c.type==='amber'?'var(--amber)':'var(--glass)';
  const svg=$('#links');
  // bright surge beam
  const beam=document.createElementNS(SVGNS,'path');
  beam.setAttribute('d',`M ${pa.x} ${pa.y} L ${pb.x} ${pb.y}`);
  beam.setAttribute('fill','none');beam.setAttribute('stroke',col);beam.setAttribute('stroke-width','2.2');
  beam.setAttribute('stroke-opacity','.85');beam.setAttribute('filter','url(#glow)');
  const len=Math.hypot(pb.x-pa.x,pb.y-pa.y);
  beam.setAttribute('stroke-dasharray',len);beam.setAttribute('stroke-dashoffset',len);
  beam.style.transition='stroke-dashoffset .9s ease';
  svg.appendChild(beam); requestAnimationFrame(()=>beam.setAttribute('stroke-dashoffset','0'));
  // travelling pulse + label
  const g=document.createElementNS(SVGNS,'g');
  const halo=document.createElementNS(SVGNS,'circle');halo.setAttribute('r','5');halo.setAttribute('fill',col);halo.setAttribute('filter','url(#glow)');
  const lab=document.createElementNS(SVGNS,'text');lab.setAttribute('x','9');lab.setAttribute('y','4');lab.setAttribute('fill',col);
  lab.setAttribute('font-family',"'IBM Plex Mono',monospace");lab.setAttribute('font-size','9.5');lab.textContent=c.label;
  const bgw=c.label.length*6+16;
  const chip=document.createElementNS(SVGNS,'rect');chip.setAttribute('x','6');chip.setAttribute('y','-6');chip.setAttribute('width',bgw);chip.setAttribute('height','13');chip.setAttribute('rx','6');chip.setAttribute('fill','#0d1418');chip.setAttribute('stroke',col);chip.setAttribute('stroke-opacity','.6');
  g.appendChild(halo);g.appendChild(chip);g.appendChild(lab);
  const mo=document.createElementNS(SVGNS,'animateMotion');
  mo.setAttribute('dur','1.5s');mo.setAttribute('fill','freeze');mo.setAttribute('path',`M ${pa.x} ${pa.y} L ${pb.x} ${pb.y}`);
  g.appendChild(mo);svg.appendChild(g);mo.beginElement&&mo.beginElement();
  setTimeout(()=>{beam.style.transition='opacity .5s';beam.style.opacity=0;g.style.transition='opacity .5s';g.style.opacity=0;},1500);
  setTimeout(()=>{beam.remove();g.remove();},2100);
}

function renderPerf(){
  const m=SITES[CURRENT].metrics;
  $('#perfStrip').innerHTML=m.map(([v,l,c])=>`<div class="pstat"><span class="v ${c}">${v}</span><span class="l etch">${l}</span></div>`).join('')+`<a href="agency.html">Open full control room →</a>`;

    return `<div class="conn"><div class="ic">▦</div><div class="nm"><b>${r.name}</b><span>${sub}</span></div><div style="width:80px;height:6px;border-radius:3px;background:var(--line)"><div style="width:${pct}%;height:6px;border-radius:3px;background:var(--glass)"></div></div></div>`;}).join('')+`</div>`

/* The shelf, shown right beside the per-sector health so you can see at a glance
   which shared APIs exist, which are stocked, and which agent is holding one. */
function shelfHealth(sh){
  if(!sh.length) return 0;
  const stocked = sh.filter(s=>s.items).length;
  return Math.round(stocked / sh.length * 100);   // a shelf with no key is dead weight
}
function shelfPanel(){
  const sh = (LIVE && LIVE.shelf) || [];
  if(!sh.length){
    return `<div class="pgroup"><div class="gh etch">The shelf · shared APIs</div>`
      + `<div class="conn"><div class="nm"><b>Not loaded</b><span>start the server so /api/state can read the cabinet</span></div></div></div>`;
  }
  const health = shelfHealth(sh);
  const stocked = sh.filter(s=>s.items).length;
  const rows = sh.map(s=>{
    const who = s.holder ? ((s.holder_sector?s.holder_sector+' · ':'')+s.holder)
                         : (s.items ? 'available' : 'no API yet');
    const names=(s.names||[]).filter(Boolean);
    const api = names.length ? names[0]+(names.length>1?(' ↳ '+names.slice(1).join(', ')):'') : '—';
    const dot = s.holder ? '●' : (s.items ? '○' : '·');
    return `<div class="conn" style="${s.items?'':'opacity:.5'}"><div class="ic">${dot}</div>`
      + `<div class="nm"><b>${s.shelf} · ${api}</b><span>${who}${s.queue?(' · '+s.queue+' queued'):''}</span></div>`
      + `<b style="font-family:'IBM Plex Mono',monospace;font-size:11px">${s.spend?('$'+s.spend):''}</b></div>`;
  }).join('');
  return `<div class="pgroup"><div class="gh etch">The shelf · shared APIs</div>`
    + `<div class="conn"><div class="ic">▩</div><div class="nm"><b>Shelf health</b>`
    + `<span>${stocked} of ${sh.length} shelves have an API</span></div>`
    + `<div style="width:80px;height:6px;border-radius:3px;background:var(--line)">`
    + `<div style="width:${health}%;height:6px;border-radius:3px;background:var(--glass)"></div></div></div>`
    + rows + `</div>`;
}
/* CONNECTIONS — read from .env through the server, not made up here.

   This panel used to be a hardcoded list. It showed a "Telegram bridge ·
   @owner" toggled ON, a DataForSEO account and an outreach domain that reads
   mail.glassworks.ae — all of it on a machine where none of those were set,
   and none of it changing when they were. /api/state has carried the real
   list the whole time (server.js readConnections), so the panel was inventing
   an answer next to the truth.

   The toggles are gone with it: a switch you can flick that changes nothing on
   the server is worse than no switch, because it looks like you turned
   something off. Connections are set on /setup, which is where the keys live. */
function renderConns(){
  const conns = (LIVE && LIVE.connections) || null;

        // "Website · not set · not set" — the server already says 'not set' in
        // the sub when there is nothing to show, and the column says it again
        + `<div class="nm"><b>${esc(c.name)}</b><span>${esc(c.on?(c.sub||''):(c.sub==='not set'?'':c.sub||''))}</span></div>`
        + `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;`
        + `color:${c.on?'var(--ok)':'var(--faint)'}">${c.on?'ON':'not set'}</div></div>`).join('')
    + `</div><div class="pgroup"><p style="font-size:11.5px;color:var(--muted);line-height:1.6">`
    + `Keys and addresses are set on the setup screen and stored on the server — `

let cur;
/* ---- TALKING TO AN AGENT ------------------------------------------------
   The drawer used to reply "On it. I'll claim that as a task on the board…" to
   anything you typed, including "are you broken?". That is worse than no chat:
   it looks like an answer and contains nothing.

   Every reply now comes from /api/chat -> coordination.agent_chat, which builds
   that desk's real record out of the cabinet — its runs, its failures, what it
   holds — and has the sector's brain explain it. The opening line is built from
   live state too, so a broken agent leads with what broke. ------------------ */
const esc=(s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* Attribute context needs the quotes too. esc() alone inside title="…" lets a
   sector name or an error message containing a double quote close the attribute
   and start writing markup. */
const escA=(s)=>esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* A value that becomes a CSS CLASS is not text — escaping does nothing useful
   for it, so it is checked against the list instead. These come from the server
   today, but the activity feed is the one screen that renders text written by
   the outside world (a rival's page title, a lead's company name, the body of
   a scraped enquiry), so nothing on it gets to reach an attribute unchecked. */
const oneOf=(v,allowed)=>allowed.includes(String(v))?String(v):allowed[0];
function bubble(kind, html){
  $('#dBody').insertAdjacentHTML('beforeend',`<div class="msg ${kind}">${html}</div>`);
  $('#dBody').scrollTop=$('#dBody').scrollHeight;
}

function openDrawer(a){
  cur=a;
  $('#dAv').textContent=a.av; $('#dName').textContent=a.n; $('#dRole').textContent=a.role;
  // the opening line is the desk's actual state, not a greeting
  let open;
  if(a.s==='blocked'){
    open = `<b style="color:var(--danger)">I've stopped.</b> ${esc(a.t)}`
         + (a.why?`<br><br>${esc(a.why)}`:'')
         + `<br><br>Ask me about it and I'll tell you what I know.`;
  } else if(a.s==='working'){
    open = `Working now — ${esc(a.t)}.`;
  } else if(a.s==='done'){
    open = `Last thing I did: ${esc(a.t)}. Ask me anything about it.`;
  } else if(a.s==='waiting'){
    open = `There's work on the board for me — ${esc(a.t)} — but nobody has claimed it yet.`;
  } else {
    open = `Nothing on the board for me right now. Ask what I'm for, or what the sector's carrying.`;
  }
  $('#dBody').innerHTML=`<div class="msg a">${open}</div>`;
  $('#drawer').classList.add('open');
  $('#dInput').focus();
}

let asking=false;
async function askAgent(){
  const v=$('#dInput').value.trim();
  if(!v || asking || !cur) return;
  asking=true; $('#dInput').value='';
  bubble('u', esc(v));
  bubble('a','<span class="dim" id="thinking">…</span>');
  const j=await (async()=>{ try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      // the id, never the label — see the note on sectors()
      body:JSON.stringify({agent:cur.id||cur.n, message:v})});
    return await r.json();
  }catch(e){ return {ok:false, error:String(e)}; }})();
  const t=document.getElementById('thinking'); if(t) t.parentElement.remove();
  asking=false;

  if(!j || !j.ok){ bubble('a', `<span style="color:var(--danger)">Couldn't reach me: ${esc((j&&j.error)||'unknown')}</span>`); return; }
  let html = esc(j.reply).replace(/\n/g,'<br>');
  // Say once, and only once, where the answer came from. Three cases, three
  // different things to do about them: nothing to fix, go and set a model up,
  // or something is broken.
  const foot=(txt,col)=>`<br><br><span class="dim" style="font-size:11px${col?';color:'+col:''}">${txt}</span>`;
  if(j.brain_error)   html += foot(`my model failed: ${esc(j.brain_error)} — that was my record read straight`,'var(--danger)');
  else if(j.unrouted) html += foot(`Read straight off my record — ${esc(j.unrouted)}. Set one on Setup → Who runs what and I can talk it through.`,'var(--amber)');
  else if(j.brain)    html += foot(`via ${esc(j.brain.model||j.brain)}`);
  bubble('a', html);
}
function openPanel(id){closeAll();$('#'+id).classList.add('open');$('#scrim').classList.add('open');}

/* ---- LIVE STATE -------------------------------------------------------
   The office used to draw hardcoded numbers. It now reads /api/state (the
   filing cabinet) and overlays the real figures, the real per-room task feed
   and the shelf. If the server isn't up it simply keeps the sample layout, so
   the floor plan never breaks. ------------------------------------------ */
let LIVE = null;

async function pullLive(){
  try{
    const r = await fetch('/api/state',{cache:'no-store'});
    const j = await r.json();
    if(!j || !j.ok) return null;
    return j;
  }catch(_){ return null; }
}

function applyLive(j){
  if(!j) return;
  const st = SITES[CURRENT];
  const pend = (j.approvals||[]).length;
  st.metrics = [
    [String(j.metrics.health), "Agency health", "glass"],
    [String(j.metrics.leads),  "Leads today",   ""],
    [String(pend),             "Awaiting you",  "amber"],
    [shelfSummary(j),          "Shelf",         "ok"],
    [String(j.metrics.spend),  "Spend today",   "mono"],
  ];
  // overlay each room's real task feed onto the desks
  const byKey = {}; (j.rooms||[]).forEach(r=>byKey[r.key]=r);
  st.rooms.forEach(rm=>{
    const live = byKey[rm.key];
    if(!live) return;
    rm.score = live.score;
    rm.foot  = live.foot;
    seatLive(rm, live.agents||[]);
  });
  renderRunButton(); renderTicker(); renderActBadge(); renderConns();
  if($('#actPanel').classList.contains('open')) renderActivity();
  // Only redraw the run panel from the poll while a day is actually going —
  // otherwise a poll landing mid-typing would wipe the orders the owner is
  // still writing into the form. (This is why RUN.touched exists too.)
  if($('#runPanel').classList.contains('open') && RUN.view==='progress') renderRun();
  else if($('#runPanel').classList.contains('open') && RUN.view==='idle') renderRun();
}

/* Put each live line at the desk it belongs to.

   Every line carries a 'slot' from the server — 'it-watcher' reports slot
   'watcher' — so running the IT health check lights the Watcher, not whichever
   desk happens to sit first in the room. A line with no matching slot (an
   unclaimed task on the board, say) takes the next empty desk rather than being
   dropped, and every desk left over goes honestly dark. */
function seatLive(rm, feed){
  const desks = rm.agents;
  desks.forEach(a=>{ if(a.staff===undefined) a.staff = a.n; a._seated = false; });

  const sit = (desk, f)=>{
    desk._seated = true;
    desk.s = f.s; desk.t = f.t;
    // a dark bulb always carries its reason — see state.py's _run_feed
    desk.why = f.why || '';
    // show WHO actually did it — a desk labelled 'Writer' while content-writer
    // holds the task tells you nothing you didn't already know.
    desk.n = (f.n && f.n !== 'unassigned') ? f.n : desk.staff;
  };

  const spare = [];
  feed.forEach(f=>{
    const slot = (f.slot||'').toLowerCase();
    const d = slot && desks.find(a=>!a._seated && a.staff.toLowerCase()===slot);
    if(d) sit(d,f); else spare.push(f);
  });
  spare.forEach(f=>{ const d = desks.find(a=>!a._seated); if(d) sit(d,f); });
  desks.forEach(a=>{
    if(!a._seated){ a.s='idle'; a.t='nothing on the board for this desk'; a.n=a.staff; a.why=''; }
  });
}

function shelfSummary(j){
  const sh = (j && j.shelf) || [];
  if(!sh.length) return "—";
  const busy = sh.filter(s=>s.holder).length;
  const stocked = sh.filter(s=>s.items).length;
  return busy ? (busy+" in use") : (stocked+"/"+sh.length);
}

/* ---- THE ACTIVITY LOG -----------------------------------------------------
   Every line here came out of a row the work itself wrote. Nothing is
   summarised into existence by the browser: if it is on this list it happened,
   and the verb is the server's word for it. -------------------------------- */
function openActivity(){ openPanel('actPanel'); renderActivity(); }

function renderActivity(){

  const VERBS=['pushed','got','grabbed','delivered','errored'];

    + `<span class="vb">${esc(e.verb)}</span>`
    + `<span class="bd"><b>${esc(e.what)}</b>`
    // 'SEO · SEO' tells you nothing twice — name the desk only when it is not
    // just the room's own name repeated back
    + `<small>${esc(e.room||'—')}${e.who && e.who.toLowerCase()!==String(e.room||'').toLowerCase() ? ' · '+esc(e.who) : ''}</small>`
    + (e.detail?` <em>${esc(e.detail)}</em>`:'')

function renderActBadge(){
  const a=(LIVE&&LIVE.activity)||{};
  const b=$('#actBadge');
  if(a.live)       b.innerHTML = `<span style="color:var(--glass)">${a.live}</span>`;
  else if(a.errors)b.innerHTML = `<span style="color:var(--danger)">${a.errors}</span>`;
  else             b.innerHTML = '';

/* The bottom strip: one line, only while something is actually happening. A
   ticker that is always on is wallpaper — you stop reading it. */
function renderTicker(){
  const a=(LIVE&&LIVE.activity)||{}, run=(LIVE&&LIVE.run)||{};
  const running = !!(run.run && run.run.running);
  const newest = (a.events||[]).find(e=>e.level==='live')||(a.events||[])[0];
  const on = running || (a.live>0);
  $('#ticker').classList.toggle('on', on);
  if(!on) return;
  $('#tickLabel').textContent = running ? (run.head||'running') : 'live';
  $('#tickLine').textContent = newest
    ? `${newest.hhmm} · ${newest.who} ${newest.verb} — ${newest.what}`
    : 'starting…';
}

/* ---- THE RUN BUTTON -------------------------------------------------------
   Four views, in the order the owner asked for: check, then his instructions,
   then work, then what happened. Never one screen — a single "go" button that
   silently preflights is a button people press without reading. ------------ */
const RUN = {view:'idle', check:null, busy:false, force:false, orders:{}, note:'',
             touched:false, saved:''};
const RUN_SECTORS = [
  ['IT','IT & Site Health'],['Content','Content & Social'],['SEO','SEO & Rankings'],
  ['Leads','Leads & Outreach'],['Report','Reports'],['Security','Security'],
];

function renderRunButton(){
  const run=(LIVE&&LIVE.run&&LIVE.run.run)||null;
  const btn=$('#runBtn');
  const live = !!(run && run.running);
  btn.classList.toggle('busy', live);
  $('#runLabel').textContent = live
    ? (((LIVE.run.progress||[0,0])[0])+'/'+((LIVE.run.progress||[0,0])[1])+' · running')
    : 'Run the day';
}

function openRun(){
  openPanel('runPanel');
  const run=(LIVE&&LIVE.run&&LIVE.run.run)||null;
  // Start from the orders already standing for today rather than blank boxes —
  // otherwise saving from this panel silently wipes what he set this morning.
  if(!RUN.touched) RUN.orders = Object.assign({}, (LIVE&&LIVE.orders)||{});
  RUN.view = (run && run.running) ? 'progress' : (RUN.check ? 'orders' : 'idle');
  renderRun();
}

function renderRun(){
  const B=$('#runBody');
  if(RUN.view==='idle')           B.innerHTML = runIdle();
  else if(RUN.view==='checking')  B.innerHTML = runChecking();
  else if(RUN.view==='orders')    B.innerHTML = runCheckResult()+runOrders();
  else if(RUN.view==='ordersonly')B.innerHTML = runOrders(true);
  else                            B.innerHTML = runProgress();
}

function standingOrders(){
  const o=(LIVE&&LIVE.orders)||{};
  const keys=Object.keys(o);
  if(!keys.length) return '';
  return `<div class="pgroup"><div class="gh etch">Your orders standing for today</div>`
    + keys.map(k=>`<div class="chk ok"><span class="m">→</span><span>${esc(k)}`
        + `<small>${esc(o[k])}</small></span></div>`).join('')
    + `<p style="font-size:11px;color:var(--faint);margin:8px 0 0">The MD plans around these.</p></div>`;
}

function runIdle(){
  return standingOrders()+`<div class="pgroup">
    <p style="font-size:12.5px;color:var(--muted);line-height:1.65;margin:0 0 14px">
      Pressing this checks the whole program first — the filing cabinet, every sector's
      brain and keys, whether each pipeline even loads, and every API and connector —
      then asks what you want out of today, and only then starts work.</p>
    <p style="font-size:12px;color:var(--faint);line-height:1.6;margin:0 0 14px">
      The check calls your models and your shelf APIs for real, so it costs a little and
      takes a moment. That is the point: a saved key is not a working key.</p>
    <button class="pbtn" onclick="doCheck(false)">Check everything</button>
    <button class="pbtn" style="border-color:var(--line2);background:var(--panel2);color:var(--muted);margin-top:8px"
            onclick="doCheck(true)">Quick check — read the config, call nothing</button>
    <button class="pbtn" style="border-color:var(--line2);background:var(--panel2);color:var(--muted);margin-top:8px"
            onclick="RUN.view='ordersonly';renderRun()">Just set today's orders</button>
  </div>`;
}

function runChecking(){
  return `<div class="pgroup">
    <div class="bar"><i style="width:35%"></i></div>
    <p style="font-size:12.5px;color:var(--glass)">Checking… calling every model and every shelf API once.</p>
    <p style="font-size:11.5px;color:var(--muted)">This can take a minute with several providers configured. Leave it open.</p>

async function doCheck(quick){
  RUN.view='checking'; renderRun();
  let j=null;
  try{
    const r=await fetch('/api/run/check',{method:'POST',headers:{'Content-Type':'application/json'},
                                          body:JSON.stringify({quick:!!quick})});
    j=await r.json();
  }catch(e){ j={ok:false,error:String(e)}; }
  RUN.check=j; RUN.view='orders'; renderRun();
  const s=await pullLive(); if(s){ LIVE=s; applyLive(s); renderFloor(); renderPerf(); }
}

function chk(tone,mark,text,sub){
  return `<div class="chk ${tone}"><span class="m">${mark}</span><span>${esc(text)}`
       + (sub?`<small>${esc(sub)}</small>`:'')+`</span></div>`;
}

function runCheckResult(){
  const c=RUN.check;
  if(!c) return '';
  if(c.ok===false) return `<div class="pgroup"><div class="warnbox"><b>The check itself failed.</b><br>${esc(c.error||'no detail')}</div></div>`;
  const sect=(c.sectors&&c.sectors.sectors)||[];
  let H = `<div class="pgroup"><div class="gh etch">The check — ${esc(c.head||'')}</div>`;
  H += chk(c.cabinet.ok?'ok':'bad', c.cabinet.ok?'✓':'✕', c.cabinet.name, c.cabinet.says);
  sect.forEach(s=>{
    const tone={ready:'ok',unchecked:'dim',thin:'warn',blocked:'bad'}[s.state]||'dim';
    const mark={ready:'✓',unchecked:'·',thin:'!',blocked:'✕'}[s.state]||'·';
    H += chk(tone, mark, s.label+' — '+s.state, s.says);
  });
  const badPipes=(c.pipelines||[]).filter(p=>!p.ok);
  H += badPipes.length
     ? badPipes.map(p=>chk('bad','✕',p.name+' will not load',p.says)).join('')
     : chk('ok','✓',`All ${(c.pipelines||[]).length} pipelines load`,'every sector’s code imports cleanly');
  H += `</div>`;

  if((c.blocking||[]).length){
    H += `<div class="pgroup"><div class="warnbox"><b>${c.blocking.length} thing${c.blocking.length>1?'s':''} stop${c.blocking.length>1?'':'s'} the day running.</b>`
       + `<ul style="margin:8px 0 0 16px;padding:0">`+c.blocking.map(b=>`<li>${esc(b)}</li>`).join('')+`</ul></div>`
       + `<div class="tick ${RUN.force?'on':''}" onclick="RUN.force=!RUN.force;renderRun()">`
       + `<span class="bx"></span><span>Run anyway. I understand those sectors will do nothing, `
       + `and the run will be recorded as forced.</span></div></div>`;
  }
  if((c.warnings||[]).length){
    H += `<div class="pgroup"><div class="gh etch">Worth knowing</div>`
       + c.warnings.map(w=>chk('warn','!',w)).join('')+`</div>`;
  }
  return H;
}

function runOrders(ordersOnly){
  const c=RUN.check, blocked=!ordersOnly && (c&&(c.blocking||[]).length)&&!RUN.force;
  let H=`<div class="pgroup"><div class="gh etch">What do you want out of today?</div>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.6">
      Anything you type here goes on the board <b>before</b> the MD plans, so it plans
      around your words instead of over them. Leave a box empty and that sector takes
      the MD's allocation as usual.</p>
    <div class="field"><label>For the whole agency (optional)</label>
      <textarea id="runNote" placeholder="e.g. two villa jobs finished this week — get them online">${esc(RUN.note)}</textarea></div>`;
  RUN_SECTORS.forEach(([k,label])=>{
    H+=`<div class="field"><label>${esc(label)}</label>`
      +`<textarea data-sec="${escA(k)}" oninput="RUN.touched=true" placeholder="today's order for ${esc(label)}">${esc(RUN.orders[k]||'')}</textarea></div>`;
  });
  if(RUN.saved) H+=`<p style="font-size:12px;color:var(--ok);margin:0 0 10px">${esc(RUN.saved)}</p>`;
  if(ordersOnly){
    H+=`<button class="pbtn" onclick="saveOrders()">Save today's orders</button>`;
  }else{
    H+=`<button class="pbtn" ${blocked?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="doStart()">`
      +(blocked?'Blocked — fix the list above, or tick "run anyway"':'Start the day')+`</button>`;
    H+=`<button class="pbtn" style="border-color:var(--line2);background:var(--panel2);color:var(--muted);margin-top:8px"
          onclick="saveOrders()">Save the orders without running</button>`;
  }
  H+=`<button class="pbtn" style="border-color:var(--line2);background:var(--panel2);color:var(--muted);margin-top:8px"
        onclick="RUN.check=null;RUN.view='idle';RUN.saved='';renderRun()">`
    +(ordersOnly?'Back':'Check again')+`</button></div>`;
  return H;
}

function collectOrders(){
  RUN.note = ($('#runNote')&&$('#runNote').value||'').trim();
  RUN.orders = {};
  document.querySelectorAll('#runBody textarea[data-sec]').forEach(t=>{
    const v=(t.value||'').trim(); if(v) RUN.orders[t.dataset.sec]=v;
  });
}

async function saveOrders(){
  collectOrders();
  let j=null;
  try{
    const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},
                                       body:JSON.stringify({orders:RUN.orders})});
    j=await r.json();
  }catch(e){ j={ok:false,why:String(e)}; }
  RUN.saved = (j&&j.ok) ? `Saved — ${(j.set||[]).join(', ')||'nothing to save'}.`
                        : `Not saved. ${(j&&(j.why||j.error))||'unknown error'}`;
  const s=await pullLive(); if(s){ LIVE=s; applyLive(s); renderFloor(); renderPerf(); }
  renderRun();
}

async function doStart(){
  collectOrders();
  RUN.busy=true;
  let j=null;
  try{
    const r=await fetch('/api/run/start',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({orders:RUN.orders, note:RUN.note, force:RUN.force})});
    j=await r.json();
  }catch(e){ j={ok:false,error:String(e)}; }
  RUN.busy=false;
  if(!j || !j.ok){
    $('#runBody').insertAdjacentHTML('afterbegin',
      `<div class="pgroup"><div class="warnbox"><b>It did not start.</b><br>${esc((j&&(j.why||j.error))||'no detail')}</div></div>`);
    return;
  }
  RUN.view='progress'; renderRun();
  // poll hard for a moment so the first step appears immediately rather than
  // on the next slow tick — the owner just pressed a button and deserves a sign
  for(let i=0;i<6;i++){
    await new Promise(r=>setTimeout(r,900));
    const s=await pullLive(); if(s){ LIVE=s; applyLive(s); renderFloor(); renderPerf(); }
    if(RUN.view==='progress') renderRun();
  }
}

function runProgress(){
  const R=(LIVE&&LIVE.run)||{};
  const run=R.run;
  if(!run) return `<div class="pgroup"><p style="color:var(--muted);font-size:12.5px">Starting…</p></div>`;
  const [done,total]=R.progress||[0,0];
  const pct = total? Math.round(done/total*100) : 0;
  let H=`<div class="pgroup"><div class="gh etch">${esc(R.head||run.status)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p style="font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace">${done}/${total} steps</p>`;
  if(run.forced) H+=`<div class="warnbox" style="margin-top:10px"><b>Forced.</b> You started this with
    ${(run.blocking||[]).length} known problem${(run.blocking||[]).length===1?'':'s'} — those sectors will do nothing.</div>`;
  H+=`</div><div class="pgroup">`;
  (R.steps||[]).forEach(s=>{
    const st=oneOf(s.status,['waiting','ok','idle','failed','running']);
    const mark={ok:'✓',idle:'–',failed:'✕',running:'▸',waiting:'·'}[st];
    H+=`<div class="step ${st}"><span class="n">${mark}</span><span class="t">${esc(s.label)}`
      +(s.summary?`<small>${esc(s.summary)}</small>`:'')+`</span></div>`;
  });
  H+=`</div><div class="pgroup"><button class="pbtn" onclick="openActivity()">See what each agent did →</button></div>`;
  return H;
}

async function boot(){
  renderFloor(); renderPerf();          // draw immediately from what we have
  LIVE = await pullLive();
  if(LIVE){ applyLive(LIVE); renderFloor(); renderPerf(); }
}

/* The floor polls faster while a day is running. At 15 seconds a pipeline that
   claims, works and finishes inside one tick is never once seen 'working' —
   the bulbs go straight from dark to done and the office looks like nothing
   happened. Four seconds is the difference between a live floor and a report. */
let POLL_MS = 15000, pollTimer = null;
function schedulePoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async ()=>{
    const j = await pullLive();
    if(j){ LIVE=j; applyLive(j); renderFloor(); renderPerf(); }
    const live = !!(j && j.run && j.run.run && j.run.run.running);
    POLL_MS = live ? 4000 : 15000;
    schedulePoll();
  }, POLL_MS);
}
schedulePoll();
renderSiteMenu();renderConns();boot();
setInterval(fireComm,2200);
setInterval(()=>{const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},1000);
document.addEventListener('click',e=>{if(!e.target.closest('.site-switch'))$('#siteMenu').classList.remove('open');});
</script>
</body>
</html>
